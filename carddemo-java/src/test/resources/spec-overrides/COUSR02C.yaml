# Deliberate differences from characterization/online/specs/COUSR02C.yaml, applied by OnlineSpecReplayTest.
# Each entry replaces whole keys of the case's given, when or then.
COUSR02C-003:
  reason: The password field loads blank because only a bcrypt hash is stored.
  then:
    fields: {USRIDINO: ADMIN002, FNAMEO: RUSSELL, LNAMEO: RUSSELL, PASSWDO: "", USRTYPEO: A}
COUSR02C-006:
  reason: The password field loads blank because only a bcrypt hash is stored.
  then:
    fields: {FNAMEO: LAURITZ, LNAMEO: ALME, PASSWDO: "", USRTYPEO: U}
COUSR02C-008:
  reason: User IDs are upper-cased on entry (the case rule), so 'admin001' finds ADMIN001.
  then:
    message: "Press PF5 key to save your updates ..."
    fields: {USRIDINO: ADMIN001, FNAMEO: MARGARET}
COUSR02C-012:
  reason: A blank password keeps the stored one, so saving an otherwise unchanged record asks for a modification.
  given:
    files:
      USRSEC:
        - {SEC-USR-ID: USER0003, SEC-USR-FNAME: LAURITZ, SEC-USR-LNAME: ALME, SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U}
  then:
    message: "Please modify to update ..."
    cursor: FNAMEL
COUSR02C-016:
  reason: Save checks that the ID exists before writing, so an unknown ID reports "User ID NOT found..." instead of the legacy REWRITE INVREQ.
  then:
    message: "User ID NOT found..."
