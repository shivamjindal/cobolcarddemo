  then:
    message: "Error updating:{} TRANSACTION_TYPE Table. SQLCODE:{detail}"
    fields:
      TRTYDSCO: "Card purchase"
      INFOMSGO: "Changes unsuccessful"
    transfer: {via: RETURN-TRANSID, to: CTTU}
    file_effects: []
