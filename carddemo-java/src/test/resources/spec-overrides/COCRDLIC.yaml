    commarea: {CDEMO-FROM-TRANID: CCLI, CDEMO-FROM-PROGRAM: COCRDLIC, CDEMO-USER-ID: ADMIN001, CDEMO-USER-TYPE: A}
COCRDLIC-026:
  reason: A first entry with no signed-on user goes to sign-on.
