# Each entry replaces whole keys of the case's given, when or then.
COTRN02C-001:
  reason: Entering without a signed-on conversation goes to sign-on.
  then:
    message: null
    cursor: null
    fields: {}
    transfer: {via: XCTL, to: COSGN00C}
COTRN02C-003:
  reason: No program hands over CDEMO-CT02-TRN-SELECTED, so arrival with one selected cannot occur.
  skip: true
COTRN02C-007:
  reason: The adapter accepts PF1 through PF12 only, so the WHEN OTHER branch is driven with PF6.
  when:
    aid: PF6
COTRN02C-012:
  reason: A multi-card account reads its first card, as the account screens read CXACAIX, instead of failing with DUPKEY.
