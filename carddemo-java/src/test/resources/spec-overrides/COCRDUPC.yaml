# Deliberate differences from characterization/online/specs/COCRDUPC.yaml, applied by OnlineSpecReplayTest.
# Each entry replaces whole keys of the case's given, when or then.
COCRDUPC-001:
  reason: A first entry with no signed-on user goes to sign-on.
  then:
    message: null
    cursor: null
    fields: {}
    transfer: {via: XCTL, to: COSGN00C}
    commarea: {}
COCRDUPC-002:
  reason: No arrival INITIALIZEs the conversation, so the user id and type survive and the origin is kept.
  then:
    commarea: {CDEMO-USER-ID: USER0001, CDEMO-USER-TYPE: U, CDEMO-FROM-PROGRAM: COMEN01C, CCUP-CHANGE-ACTION: ""}
COCRDUPC-004:
  reason: A card that is not found leaves the screen searching, with the prompt, instead of editing a card that was never fetched.
