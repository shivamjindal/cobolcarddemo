<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: screen('Delete User', ~{::main}, ~{::nav})}">
<main>
    <div class="fields">
        <th:block th:replace="~{fields :: field('USRIDIN', 'Enter User ID:', 8)}"></th:block>
        <th:block th:replace="~{fields :: text('FNAME', 'First Name:')}"></th:block>
        <th:block th:replace="~{fields :: text('LNAME', 'Last Name:')}"></th:block>
        <th:block th:replace="~{fields :: text('USRTYPE', 'User Type:')}"></th:block>
    </div>
</main>
<nav class="keys">
    <button name="aid" value="ENTER">ENTER=Fetch</button>
    <button name="aid" value="PF3">F3=Back</button>
    <button name="aid" value="PF4">F4=Clear</button>
    <button name="aid" value="PF5">F5=Delete</button>
    <button name="aid" value="PF12">F12=Cancel</button>
</nav>
</html>
