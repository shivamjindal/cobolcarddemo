<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="field(name, label, size)">
    <label th:for="${name}" th:text="${label}"></label>
    <input th:id="${name}" th:name="${name}" th:data-testid="${name}" th:size="${size}" th:maxlength="${size}"
           th:type="${name == 'PASSWD'} ? 'password' : 'text'" th:value="${screen.fields.get(name)}"
           th:readonly="${screen.readOnly.contains(name)}" th:autofocus="${screen.cursor == name}">
</th:block>

<th:block th:fragment="text(name, label)">
    <span class="label" th:text="${label}"></span>
    <span class="value" th:data-testid="${name}" th:text="${screen.fields.get(name)}"></span>
</th:block>
</html>
