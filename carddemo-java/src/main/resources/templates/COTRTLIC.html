<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: screen('Maintain Transaction Type', ~{::main}, ~{::nav})}">
<main>
    <p class="intro">Page: <span class="value" data-testid="PAGENO" th:text="${screen.fields.get('PAGENO')}"></span></p>
    <div class="fields">
        <th:block th:replace="~{fields :: field('TRTYPE', 'Type Filter:', 2)}"></th:block>
        <th:block th:replace="~{fields :: field('TRDESC', 'Description Filter:', 50)}"></th:block>
    </div>
    <table>
        <thead>
        <tr><th>Select</th><th>Type</th><th>Description</th></tr>
        </thead>
        <tbody>
        <th:block th:each="row : ${#numbers.sequence(1, 7)}"
                  th:with="sel=|TRTSEL${row}|, code=${screen.fields.get('TRTTYP' + row)}, desc=|TRTYPD${row}|">
            <tr th:unless="${#strings.isEmpty(code)}">
                <td><input th:id="${sel}" th:name="${sel}" th:data-testid="${sel}" size="1" maxlength="1"
                           th:value="${screen.fields.get(sel)}" th:readonly="${screen.readOnly.contains(sel)}"
                           th:autofocus="${screen.cursor == sel}"></td>
                <td><span th:data-testid="|TRTTYP${row}|" th:text="${code}"></span>
                    <input type="hidden" th:name="|TRTTYP${row}|" th:value="${code}"></td>
                <td><input th:id="${desc}" th:name="${desc}" th:data-testid="${desc}" size="50" maxlength="50"
                           th:value="${screen.fields.get(desc)}" th:readonly="${screen.readOnly.contains(desc)}"
                           th:autofocus="${screen.cursor == desc}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <p class="intro" data-testid="INFOMSG" th:text="${screen.fields.get('INFOMSG')}"></p>
</main>
<nav class="keys">
    <button name="aid" value="ENTER">ENTER=Process</button>
    <button name="aid" value="PF2">F2=Add</button>
    <button name="aid" value="PF3">F3=Exit</button>
    <button name="aid" value="PF7">F7=Page Up</button>
    <button name="aid" value="PF8">F8=Page Dn</button>
    <button name="aid" value="PF10">F10=Save</button>
</nav>
</html>
