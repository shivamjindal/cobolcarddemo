<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: screen('List Users', ~{::main}, ~{::nav})}">
<main>
    <p class="intro">Page: <span class="value" data-testid="PAGENUM" th:text="${screen.fields.get('PAGENUM')}"></span></p>
    <div class="fields">
        <th:block th:replace="~{fields :: field('USRIDIN', 'Search User ID:', 8)}"></th:block>
    </div>
    <table>
        <thead>
        <tr><th>Sel</th><th>User ID</th><th>First Name</th><th>Last Name</th><th>Type</th></tr>
        </thead>
        <tbody>
        <th:block th:each="i : ${#numbers.sequence(1, 10)}"
                  th:with="row=${#numbers.formatInteger(i, 2)}, sel=|SEL00${row}|, id=${screen.fields.get('USRID' + row)}">
            <tr th:unless="${#strings.isEmpty(id)}">
                <td><input th:id="${sel}" th:name="${sel}" th:data-testid="${sel}" size="1" maxlength="1"
                           th:value="${screen.fields.get(sel)}" th:autofocus="${screen.cursor == sel}"></td>
                <td><label th:for="${sel}" th:data-testid="|USRID${row}|" th:text="${id}"></label>
                    <input type="hidden" th:name="|USRID${row}|" th:value="${id}"></td>
                <td th:data-testid="|FNAME${row}|" th:text="${screen.fields.get('FNAME' + row)}"></td>
                <td th:data-testid="|LNAME${row}|" th:text="${screen.fields.get('LNAME' + row)}"></td>
                <td th:data-testid="|UTYPE${row}|" th:text="${screen.fields.get('UTYPE' + row)}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <p class="intro">Type 'U' to Update or 'D' to Delete a user from the list</p>
</main>
<nav class="keys">
    <button name="aid" value="ENTER">ENTER=Continue</button>
    <button name="aid" value="PF3">F3=Back</button>
    <button name="aid" value="PF7">F7=Backward</button>
    <button name="aid" value="PF8">F8=Forward</button>
</nav>
</html>
