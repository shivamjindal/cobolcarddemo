<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: screen('List Credit Cards', ~{::main}, ~{::nav})}">
<main>
    <p class="intro">Page: <span class="value" data-testid="PAGENO" th:text="${screen.fields.get('PAGENO')}"></span></p>
    <div class="fields">
        <th:block th:replace="~{fields :: field('ACCTSID', 'Account Number:', 11)}"></th:block>
        <th:block th:replace="~{fields :: field('CARDSID', 'Credit Card Number:', 16)}"></th:block>
    </div>
    <table>
        <thead>
        <tr><th>Select</th><th>Account Number</th><th>Card Number</th><th>Active</th></tr>
        </thead>
        <tbody>
        <th:block th:each="row : ${#numbers.sequence(1, 7)}"
                  th:with="sel=|CRDSEL${row}|, card=${screen.fields.get('CRDNUM' + row)}">
            <tr th:unless="${#strings.isEmpty(card)}">
                <td><input th:id="${sel}" th:name="${sel}" th:data-testid="${sel}" size="1" maxlength="1"
                           th:value="${screen.fields.get(sel)}" th:autofocus="${screen.cursor == sel}"></td>
                <td th:data-testid="|ACCTNO${row}|" th:text="${screen.fields.get('ACCTNO' + row)}"></td>
                <td><label th:for="${sel}" th:data-testid="|CRDNUM${row}|" th:text="${card}"></label></td>
                <td th:data-testid="|CRDSTS${row}|" th:text="${screen.fields.get('CRDSTS' + row)}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <p class="intro" data-testid="INFOMSG" th:text="${screen.fields.get('INFOMSG')}"></p>
</main>
<nav class="keys">
    <button name="aid" value="ENTER">ENTER=Continue</button>
    <button name="aid" value="PF3">F3=Exit</button>
    <button name="aid" value="PF7">F7=Backward</button>
    <button name="aid" value="PF8">F8=Forward</button>
</nav>
</html>
