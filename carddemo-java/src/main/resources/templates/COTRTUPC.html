<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: screen('Maintain Transaction Type', ~{::main}, ~{::nav})}">
<main>
    <div class="fields">
        <th:block th:replace="~{fields :: field('TRTYPCD', 'Transaction Type:', 2)}"></th:block>
        <th:block th:replace="~{fields :: field('TRTYDSC', 'Description:', 50)}"></th:block>
    </div>
    <p class="intro" data-testid="INFOMSG" th:text="${screen.fields.get('INFOMSG')}"></p>
</main>
<nav class="keys">
    <button name="aid" value="ENTER">ENTER=Process</button>
    <button name="aid" value="PF3">F3=Exit</button>
    <button name="aid" value="PF4">F4=Delete</button>
    <button name="aid" value="PF5">F5=Save</button>
    <button name="aid" value="PF6">F6=Add</button>
    <button name="aid" value="PF12">F12=Cancel</button>
</nav>
</html>
