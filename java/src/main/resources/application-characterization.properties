# The warm server behind java/characterization-adapter. Its own database, so goldens never touch the dev data.
spring.datasource.url=${CARDDEMO_CHARACTERIZATION_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_characterization}
server.port=${CARDDEMO_CHARACTERIZATION_PORT:18080}
server.address=127.0.0.1
carddemo.characterization.idle-shutdown=PT10M
carddemo.characterization.clock=2026-11-05T10:00:00
