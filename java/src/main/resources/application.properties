spring.application.name=carddemo
spring.main.banner-mode=off
spring.datasource.url=${CARDDEMO_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo}
spring.datasource.username=${CARDDEMO_JDBC_USER:carddemo}
spring.datasource.password=${CARDDEMO_JDBC_PASSWORD:carddemo}
spring.flyway.enabled=true
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
server.port=${CARDDEMO_PORT:8080}
