# COTRN02C characterization spec. Derived from reading source, not executed.
# See ../SCHEMA.md. Conventions for values are in `notes`.
program: COTRN02C
transaction: CT02
screen:
  mapset: COTRN02
  map: COTRN2A
evidence: derived
sources: [app/cbl/COTRN02C.cbl, app/cbl/CSUTLDTC.cbl, app/bms/COTRN02.bms, app/cpy-bms/COTRN02.CPY, app/cpy/COCOM01Y.cpy,
  app/cpy/CVTRA05Y.cpy, app/cpy/CVACT03Y.cpy, app/cpy/CSDAT01Y.cpy, app/cpy/CSMSG01Y.cpy, app/csd/CARDDEMO.CSD]
files:
- name: CXACAIX
  ops: [READ]
  key: XREF-ACCT-ID
- name: CCXREF
  ops: [READ]
  key: XREF-CARD-NUM
- name: TRANSACT
  ops: [STARTBR, READPREV, ENDBR, WRITE]
  key: TRAN-ID
navigation:
- to: COSGN00C
  via: XCTL
  when: started without a COMMAREA (EIBCALEN = 0), lines 115-117
- to: COMEN01C
  via: XCTL
  when: PF3; goes to CDEMO-FROM-PROGRAM, COMEN01C when blank (the menu is the only caller), lines 136-143
- to: CT02
  via: RETURN-TRANSID
  when: every screen send, lines 530-534
notes: ['Value conventions: field and record values are shown without trailing pad spaces; "" means the field is
    all spaces or LOW-VALUES. Numeric record fields are written as decimal strings (e.g. TRAN-AMT "12.50"). Input
    values are the full field content as BMS delivers it: default JUSTIFY=(LEFT,BLANK) pads short input with trailing
    spaces, which is why several IS NUMERIC checks reject short entries.', 'A {NAME} placeholder inside a message
    or a record value is a runtime value. {} marks the seam between two adjacent STRING literals and renders as
    the empty string, because the schema''s fragment check cannot match two literals that the COBOL concatenates
    with no variable between them. A runner should treat {NAME} and {} as wildcards. This is the same convention
    COACTVWC.yaml uses.', 'CICS RESP branches other than NORMAL/NOTFND/ENDFILE/DUPKEY (I/O errors, DISABLED files)
    cannot be set up through `given.files`, so they are listed here instead of as cases.', 'SEND-TRNADD-SCREEN ends
    with EXEC CICS RETURN TRANSID (lines 530-534). Every validation failure ends the task at its own send, so the
    checks run in a fixed order and the first failure is the only message. In order: key fields (lines 193-230),
    empty data fields in the order Type, Category, Source, Description, Amount, Orig Date, Proc Date, Merchant ID/Name/City/Zip
    (lines 251-320), Type and Category numeric (322-337), amount mask (339-351), date masks (353-380), CSUTLDTC
    validity (388-427), Merchant ID numeric (430-436), then the confirmation (169-187).', 'Dead code: lines 237-249
    blank the data fields when the error flag is on, but no error can reach there because each one RETURNs first.
    WS-ACCTDAT-FILE (line 40) and COPY CVACT01Y are declared and never used; ACCTDAT is not touched.', 'Key fields:
    a non-blank Account ID takes priority. It must be all digits across 11 characters, is normalised with NUMVAL,
    read through CXACAIX (the account-keyed AIX path over CCXREF; both names refer to the same records), and the
    card field is replaced with XREF-CARD-NUM. Otherwise a non-blank Card Number must be all 16 digits, is read
    in CCXREF, and the account field is filled from XREF-ACCT-ID.', 'The CXACAIX AIX is defined NONUNIQUEKEY (app/jcl/XREFFILE.jcl
    line 75). For an account with more than one card, CICS returns DUPKEY on the READ, and line 596 treats that
    as an error (case COTRN02C-012). This runtime behavior is inferred from CICS semantics, not observed.', 'Amount
    mask (lines 340-343): position 1 must be ''-'' or ''+'', positions 2-9 digits, position 10 ''.'', positions
    11-12 digits. The message shows only the ''-'' form. After the checks, line 382 re-edits the field through NUMVAL-C
    into PIC +99999999.99.', 'Type CD is X(02) and Category CD X(04). Each must be fully numeric, so ''1'' (padded
    to ''1 '') is rejected as not numeric.', 'Date validity calls CSUTLDTC with a COBOL CALL (lines 392-394, 413-415),
    not EXEC CICS LINK. CSUTLDTC passes the date and the mask ''YYYY-MM-DD'' to the LE service CEEDAYS (app/cbl/CSUTLDTC.cbl
    lines 116-120). It returns the severity in result positions 1-4 and the message number in positions 16-19 (CSUTLDTC.cbl
    lines 42-49, 123-124). The screen messages are COTRN02C literals, not CSUTLDTC text. The caller accepts severity
    ''0000'' and also ignores message number 2513, which is CEEDAYS ''Unsupp. Range'' (X''09D1'', CSUTLDTC.cbl lines
    66, 136-137). Dates outside the CEEDAYS range therefore pass (case COTRN02C-036).', 'Merchant ID is checked
    for empty and numeric only. Merchant name, city and zip are only checked for empty. No check ties the card to
    the account beyond the xref lookup, and no check compares Orig and Proc dates.', 'Confirmation: ''Y'' or ''y''
    adds. ''N'', ''n'', blank and LOW-VALUES all re-prompt with ''Confirm to add this transaction...'' (lines 173-181).
    Unlike COBIL00C, ''N'' does not clear the screen.', 'New id (lines 444-451): STARTBR with TRAN-ID = HIGH-VALUES,
    one READPREV (the highest key on file), ENDBR, then TRAN-ID + 1 as a 16-digit zero-padded number. There is no
    locking between the READPREV and the WRITE. Two concurrent adds can compute the same id, and the loser gets
    ''Tran ID already exist...'' (DUPREC, lines 735-741).', 'Unverified runtime behavior for an empty TRANSACT file:
    READPREV ENDFILE would set TRAN-ID to zeros, making the new id 0000000000000001 (lines 687-688). CICS may instead
    return NOTFND on the HIGH-VALUES STARTBR, which shows ''Transaction ID NOT found...'' and stops (lines 655-660).',
  'Record written (lines 450-465): INITIALIZE TRAN-RECORD, then TRAN-TYPE-CD, TRAN-CAT-CD, TRAN-SOURCE, TRAN-DESC,
    TRAN-MERCHANT-ID/NAME/CITY/ZIP and TRAN-CARD-NUM straight from the screen, with TRAN-AMT = NUMVAL-C(amount).
    TRAN-ORIG-TS and TRAN-PROC-TS receive only the 10-character screen date, left-justified in X(26) with no time
    part. Batch-loaded records carry full timestamps.', 'Success: the green message (ERRMSGC = DFHGREEN, line 727)
    renders as ''Transaction added successfully.  Your Tran ID is 0000000000000023.'', with two spaces after the
    first period.', 'PF5 (COPY-LAST-TRAN-DATA, lines 472-494) validates the key fields, then copies the highest-keyed
    TRANSACT record onto the screen: type, category, source, amount, description (cut to 60), both timestamps cut
    to YYYY-MM-DD, and merchant id, name (cut to 30), city (cut to 25) and zip. It then runs full ENTER processing.
    The source record may belong to any card. If the confirmation field already holds ''Y'', the copy is written
    at once (case COTRN02C-045).', 'Arrival with CDEMO-CT02-TRN-SELECTED (lines 124-129) puts it in the Card Number
    field and runs ENTER processing, so the first screen already shows ''Type CD can NOT be empty...''. Nothing
    in this repo XCTLs here with that field set. COMEN01C passes only COCOM01Y, which line 119 pads with spaces.',
  'I/O error branches: CXACAIX ''Unable to lookup Acct in XREF AIX file...'' (lines 596-603); CCXREF ''Unable to
    lookup Card # in XREF file...'' (630-637); STARTBR/READPREV ''Unable to lookup Transaction...'' (661-668, 690-697);
    WRITE DUPKEY/DUPREC ''Tran ID already exist...'' (735-741), other ''Unable to Add Transaction...'' (742-748).
    All put the cursor on ACTIDINL except the CCXREF ones, which use CARDNINL.', 'The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COTRN02C.yaml.']
