      commarea:
        CDEMO-FROM-PROGRAM: COCRDLIC
        CDEMO-FROM-TRANID: CCLI
        CDEMO-PGM-CONTEXT: 1
        CDEMO-LAST-MAPSET: COCRDLI
        CDEMO-ACCT-ID: "00000000002"
        CDEMO-CARD-NUM: "4000000000000005"
