      fields: {ACCTSIDI: "00000000001", CARDSIDI: "4000000000000002"}
    then:
      message: null
      cursor: ACCTSIDL
      fields:
        CRDNAMEO: "John Smith"
        INFOMSGO: "   Displaying requested details"
      transfer: {via: RETURN-TRANSID, to: CCDL}
