      fields: {ACCTSIDI: "00000000002", CARDSIDI: ""}
    then:
      message: "NO MORE RECORDS TO SHOW"
      cursor: ACCTSIDL
      fields:
        ACCTSIDO: "00000000002"
        INFOMSGO: "TYPE S FOR DETAIL, U TO UPDATE ANY RECORD"
        ACCTNO1O: "00000000002"
        CRDNUM1O: "4000000000000004"
        CRDNUM2O: "4000000000000005"
