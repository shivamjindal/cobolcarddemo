    given:
      entry: reenter
      commarea:
        CDEMO-FROM-PROGRAM: COCRDLIC
        CDEMO-PGM-CONTEXT: 0
        CDEMO-USER-TYPE: U
        WS-CA-SCREEN-NUM: 2
        WS-CA-FIRST-CARD-NUM: "4000000000000008"
        WS-CA-LAST-CARD-NUM: "4000000000000015"
        WS-CA-NEXT-PAGE-IND: "Y"
        WS-CA-LAST-PAGE-DISPLAYED: 9
      files:
        CARDDAT: *cards16
    when:
      aid: ENTER
      fields: {ACCTSIDI: "", CARDSIDI: ""}
    then:
      message: null
      cursor: ACCTSIDL
      fields:
        PAGENOO: "2"
        INFOMSGO: "TYPE S FOR DETAIL, U TO UPDATE ANY RECORD"
        CRDNUM1O: "4000000000000008"
        CRDNUM7O: "4000000000000014"
      transfer: {via: RETURN-TRANSID, to: CCLI}
      commarea:
        WS-CA-SCREEN-NUM: 2
        WS-CA-FIRST-CARD-NUM: "4000000000000008"
        WS-CA-LAST-CARD-NUM: "4000000000000015"
        WS-CA-NEXT-PAGE-IND: "Y"
      file_effects: []
    source:
      file: app/cbl/COCRDLIC.cbl
      lines: [572, 582]

  - id: COCRDLIC-009
