      commarea: {CDEMO-PGM-CONTEXT: 1, CDEMO-CU00-PAGE-NUM: 1}
      files:
        USRSEC: *users12
    when:
      aid: ENTER
      fields:
        SEL0001I: X
        USRID01I: ADMIN001
    then:
      message: "Invalid selection. Valid values are U and D"
      cursor: USRIDINL
      fields:
        PAGENUMO: "00000001"
        USRID01O: ADMIN001
        USRID10O: USER0005
      transfer: {via: RETURN-TRANSID, to: CU00}
      commarea:
        CDEMO-CU00-USR-SEL-FLG: X
        CDEMO-CU00-USR-SELECTED: ADMIN001
        CDEMO-CU00-NEXT-PAGE-FLG: "Y"
      file_effects: []
    source:
      file: app/cbl/COUSR00C.cbl
      lines: [210, 215]

  - id: COUSR00C-014
    summary: with 10 or fewer users from the start key, the invalid-selection message is overwritten by the bottom-of-page message
    given:
      entry: reenter
      commarea: {CDEMO-PGM-CONTEXT: 1, CDEMO-CU00-PAGE-NUM: 1}
      files:
        USRSEC: *users10
    when:
      aid: ENTER
      fields:
        SEL0001I: X
        USRID01I: ADMIN001
    then:
      message: "You have reached the bottom of the page..."
      cursor: USRIDINL
      transfer: {via: RETURN-TRANSID, to: CU00}
      file_effects: []
    source:
      file: app/cbl/COUSR00C.cbl
      lines: [630, 640]

  - id: COUSR00C-015
    summary: a filter beyond the last key (STARTBR NOTFND) sends the top-of-page message; the following ENDBR then abends the task (see notes), so no RETURN TRANSID is asserted
    given:
