      commarea: {CDEMO-PGM-CONTEXT: 1, CDEMO-CU00-PAGE-NUM: 1}
      files:
        USRSEC: *users12
    when:
      aid: ENTER
      fields:
        USRIDINI: ZZZZZZZZ
    then:
      message: "You are at the top of the page..."
      cursor: USRIDINL
      transfer: null
      file_effects: []
    source:
      file: app/cbl/COUSR00C.cbl
