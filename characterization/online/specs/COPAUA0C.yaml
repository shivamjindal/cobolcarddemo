notes:
  - "CICS starts CP00 from an MQ trigger (CRDDEMO2.csd). 1000-INITIALIZE RETRIEVEs the MQTM for the request queue name and opens it (lines 230-247). 2000-MAIN-PROCESS then loops MQGET, process, SYNCPOINT until no message arrives within 5 seconds or more than 500 messages are done (lines 326-344). Each trigger case is one request message processed by a fresh task."
  - "MQGET is NO-SYNCPOINT (line 389), so the request leaves the queue at once and is lost if the task fails. MQPUT1 of the reply is NO-SYNCPOINT too (line 753), so the reply is visible before the IMS updates of 8000-WRITE-AUTH-TO-DB commit. The reply is non-persistent with MQMD-EXPIRY 50, five seconds (lines 749-750), goes to the request's MQMD-REPLYTOQ and carries its MQMD-CORRELID (lines 411-414, 742-745)."
  - "Request (2100-EXTRACT-REQUEST-MSG, lines 354-379). The message is comma separated in CCPAURQY order: auth date YYMMDD, auth time HHMMSS, card number, auth type, card expiry MMYY, message type, message source, processing code, amount, merchant category code, acquirer country, POS entry mode, merchant id, name, city, state, zip, transaction id. UNSTRING truncates or space-pads each value to its field. A message with fewer values leaves the remaining fields as the previous message set them."
  - "The amount is UNSTRINGed into WS-TRANSACTION-AMT-AN, an X(13), one byte shorter than the request layout's PA-RQ-TRANSACTION-AMT PIC +9(10).99. A 14-character amount in that layout loses its last digit before FUNCTION NUMVAL (case COPAUA0C-010). COMPUTE truncates to two decimals."
  - "Decision (6000-MAKE-DECISION, lines 664-682). With a summary segment the available amount is PA-CREDIT-LIMIT - PA-CREDIT-BALANCE. Without one it is ACCT-CREDIT-LIMIT - ACCT-CURR-BAL, and without the account too the request is declined. An amount greater than the available amount is declined, so an amount equal to it is approved (case COPAUA0C-002). The customer read does not take part in the decision."
  - "Reason (lines 697-718). Approved is '0000'. A decline is '3100' when the card, its account or its customer was not found, even when the amount is also over the limit (case COPAUA0C-009), and '4100' otherwise. The '4200', '4300', '5100', '5200' and '9000' branches are unreachable because nothing sets CARD-NOT-ACTIVE, ACCOUNT-CLOSED, CARD-FRAUD or MERCHANT-FRAUD (5600-READ-PROFILE-DATA is CONTINUE, line 650), and every decline is either a lookup miss or insufficient funds."
  - "Reply (lines 720-731). STRING DELIMITED BY SIZE writes card number X(16), transaction id X(15), auth id code X(6), response code X(2), reason X(4) and WS-APPROVED-AMT-DIS PIC -zzzzzzzzz9.99, each followed by a comma. The auth id code is the request's auth time (line 662). The approved amount is the request amount when approved and zero when declined. Replies are written right-trimmed with the variable parts as placeholders."
  - "WS-RESP-LENGTH, the STRING pointer and the reply length, starts at 1 (line 46) and is never reset. The first reply of a task is 64 bytes, one byte beyond the 63 written (W02-PUT-BUFFER has no VALUE). Each later message of the same task writes after the previous reply and sends everything so far. The specs see one message per task."
  - "Only CARD-FOUND-XREF, FOUND-ACCT-IN-MSTR and APPROVE-AUTH are reset per message (lines 441-446). The customer, summary and decline-reason flags keep their previous values until set again. Within the reachable paths this changes no decision."
  - "A card missing from CCXREF is declined with no IMS update (lines 450-465). Otherwise 8400-UPDATE-SUMMARY (lines 798-848) inserts a new summary, INITIALIZEd with PA-ACCT-ID and PA-CUST-ID from the xref, or replaces the existing one. Both copy ACCT-CREDIT-LIMIT and ACCT-CASH-CREDIT-LIMIT into the summary after the decision used the old summary limits (case COPAUA0C-002). With the account missing that copy is of an unread ACCOUNT-RECORD, so those cases leave the limits out."
  - "An approval adds 1 to PA-APPROVED-AUTH-CNT, the approved amount to PA-APPROVED-AUTH-AMT and to PA-CREDIT-BALANCE, and sets PA-CASH-BALANCE to zero (lines 813-818). A new summary's credit balance starts at zero, not at the account's current balance, so later decisions on that account see only the pending approvals made here."
  - "A decline adds 1 to PA-DECLINED-AUTH-CNT and adds PA-TRANSACTION-AMT to PA-DECLINED-AUTH-AMT (lines 820-821). PA-TRANSACTION-AMT is the detail segment's field, which 8500-INSERT-AUTH only fills afterwards (line 884). In a task's first message it holds whatever working storage held (packed decimal, a data exception if it is not valid), later the previous message's amount. Decline cases leave PA-DECLINED-AUTH-AMT out."
  - "8500-INSERT-AUTH (lines 855-933) inserts PAUTDTL1 under the account's summary. Its key PA-AUTHORIZATION-KEY is PA-AUTH-DATE-9C = 99999 - YYDDD and PA-AUTH-TIME-9C = 999999999 - (HHMMSS * 1000 + milliseconds) of CICS ASKTIME, so the newest authorization of an account sorts first. PA-MATCH-STATUS is 'P' when approved and 'D' when declined, PA-AUTH-FRAUD and PA-FRAUD-RPT-DATE are spaces."
  - "PAUTDTL1 records here carry the parent summary's PA-ACCT-ID. Because the IMS key comes from the clock, the placeholders {99999 - YYDDD} and {999999999 - HHMMSSmmm} stand for it."
  - "Errors go through 9500-LOG-ERROR (lines 983-1011), which writes a CCPAUERY record to the CSSL transient data queue. The not-found paths log warnings A001, A002 and A003 and carry on. Any other CICS, IMS or MQ failure is critical and ends the task (9990-END-ROUTINE), after the reply when it happens in 8000. The schema cannot inject IMS or MQ failures, so no case asserts them."
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COPAUA0C.yaml.
