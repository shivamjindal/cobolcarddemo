program: COTRTUPC
transaction: CTTU
module: app/app-transaction-type-db2
screen:
  mapset: COTRTUP
  map: CTRTUPA
evidence: derived
sources:
  - app/app-transaction-type-db2/cbl/COTRTUPC.cbl
  - app/app-transaction-type-db2/bms/COTRTUP.bms
  - app/app-transaction-type-db2/ddl/TRNTYPE.ddl
  - app/app-transaction-type-db2/ddl/TRNTYCAT.ddl
files:
  - name: TRANSACTION_TYPE
    ops: [READ, WRITE, REWRITE, DELETE]
    key: TR_TYPE
  - name: TRANSACTION_TYPE_CATEGORY
    ops: [READ]
    key: TRC_TYPE_CODE
navigation:
  - to: COADM01C
    via: XCTL
    when: PF3 and the caller is blank or the admin menu (lines 429-460)
  - to: COTRTLIC
    via: XCTL
    when: PF3 and the caller is the list (lines 429-460)
  - to: CTTU
    via: RETURN-TRANSID
    when: every path that sends the map (lines 559-571)
notes:
  - "Derived from source, not executed. TTUP-CHANGE-ACTION is the phase: blank search, S details, X not found, R add, N confirm save, 9 confirm delete, C saved, B backed out, E edit error, 7 deleted, 6 delete failed."
  - "Showing a found type uses the search prompt. The SHOW-DETAILS when falls through to the search-key message (lines 1221-1225)."
  - "A blank or asterisk type becomes low-values and fails 'Tran Type code must be supplied.' The 'No input received' 88 is not reached, because that message is set only while the return message is still spaces (lines 720-723)."
  - "A numeric type is zero-padded to two digits (lines 834-841). Zero is rejected."
  - "F5 on a missing type asks for a description, then confirms, then inserts because the update finds no row (lines 1558-1559)."
  - "PF6 is on the map and is never a valid key, so it produces 'Invalid key pressed' (lines 582-607)."
  - "These 88-level messages are never set, so no case produces them: 'Selected transaction type shown above', 'Looks Good.... so far', 'Name can only contain alphabets and spaces', 'PF03 pressed.Exiting', 'Invalid Key pressed. ', 'No input received', 'Record changed by some one else. Please review'. 'Could not lock record for update' is SQLCODE -911, which this port does not inject."
  - "A failed update overwrites the failure 88 before the phase evaluate, so the source then marks the action saved and the info line says the change was committed (lines 1567-1588). The Java port keeps the failure message and the unsuccessful info. See carddemo-java/src/test/resources/spec-overrides/COTRTUPC.yaml."
  - "Info text is centered in the 40-byte INFOMSG (lines 1249-1262). The spec asserts the trimmed sentence."
