program: COTRTLIC
transaction: CTLI
module: app/app-transaction-type-db2
screen:
  mapset: COTRTLI
  map: CTRTLIA
evidence: derived
sources:
  - app/app-transaction-type-db2/cbl/COTRTLIC.cbl
  - app/app-transaction-type-db2/cpy/CSDB2RPY.cpy
  - app/app-transaction-type-db2/bms/COTRTLI.bms
  - app/app-transaction-type-db2/ddl/TRNTYPE.ddl
  - app/app-transaction-type-db2/ddl/TRNTYCAT.ddl
files:
  - name: TRANSACTION_TYPE
    ops: [READ, REWRITE, DELETE]
    key: TR_TYPE
  - name: TRANSACTION_TYPE_CATEGORY
    ops: [READ]
    key: TRC_TYPE_CODE
navigation:
  - to: COADM01C
    via: XCTL
    when: PF3, or the from program is blank or this program (lines 591-623)
  - to: COTRTUPC
    via: XCTL
    when: PF2 after this program has displayed the list (lines 630-651)
  - to: CTLI
    via: RETURN-TRANSID
    when: every path that sends the list (lines 899-914)
notes:
  - "Derived from source, not executed. TRANSACTION_TYPE is the Db2 table. The Java port stores it in tran_types."
  - "Seven rows (WS-MAX-SCREEN-LINES). A full page fetches one extra row and keeps that row's type as the PF8 anchor (lines 1657-1673)."
  - "PF7, PF8, PF2, PF3 and F10 (only while a delete or update is pending and the filters and selection are unchanged) are distinct. Every other AID is treated as ENTER (lines 574-586 and 666-675)."
  - "A type filter of spaces or zeros is no filter. Anything else that is not numeric is rejected (lines 1101-1118). A description filter is a LIKE '%text%' match (lines 1155-1162)."
  - "Info text is centered in the 45-byte INFOMSG (lines 1562-1577). The spec asserts the trimmed sentence."
  - "PF2 sets CDEMO-USRTYP-USER before the XCTL (line 634). The signed-on user is unchanged, otherwise the add screen would reject the admin."
  - "Selecting a row in the same request that changes a filter is ignored. The source tests the changed-flag before it is set (lines 991-994 run before 1220), so the legacy program can still see the selection. The Java port applies the new filter."
  - "A backward read that finds fewer than 7 predecessors treats SQLCODE +100 as a cursor error (lines 1777-1787)."
  - "The Java slice replays this spec with deliberate differences listed in carddemo-java/src/test/resources/spec-overrides/COTRTLIC.yaml."
