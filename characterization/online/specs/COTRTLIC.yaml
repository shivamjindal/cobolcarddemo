    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      cursor: TRTYPEL
      fields:
        TRNNAMEO: CTLI
        PGMNAMEO: COTRTLIC
        PAGENOO: "1"
        TRTTYP1O: "01"
        TRTYPD1O: Purchase
        INFOMSGO: "Type U to update, D to delete any record"
      transfer: {via: RETURN-TRANSID, to: CTLI}
      file_effects: []
    source:
      file: app/app-transaction-type-db2/cbl/COTRTLIC.cbl
      lines: [515, 525]

