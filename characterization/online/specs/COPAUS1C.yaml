program: COPAUS1C
module: app/app-authorization-ims-db2-mq
transaction: CPVD
screen:
  mapset: COPAU01
  map: COPAU1A
evidence: derived
sources:
  - app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl
  - app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl
  - app/app-authorization-ims-db2-mq/cpy/CIPAUSMY.cpy
  - app/app-authorization-ims-db2-mq/cpy/CIPAUDTY.cpy
  - app/app-authorization-ims-db2-mq/bms/COPAU01.bms
  - app/app-authorization-ims-db2-mq/ims/DBPAUTP0.dbd
  - app/app-authorization-ims-db2-mq/ddl/AUTHFRDS.ddl
  - app/app-authorization-ims-db2-mq/csd/CRDDEMO2.csd
  - app/cpy/COCOM01Y.cpy
  - app/cpy/CSMSG01Y.cpy
  - app/cpy/CSDAT01Y.cpy
files:
  - name: PAUTSUM0
    ops: [READ]
    key: PA-ACCT-ID
  - name: PAUTDTL1
    ops: [READ, REWRITE]
    key: PA-AUTHORIZATION-KEY
  - name: AUTHFRDS
    ops: [WRITE, REWRITE]
    key: CARD_NUM
navigation:
  - to: COPAUS0C
    via: XCTL
    when: EIBCALEN = 0 (lines 164-169) and PF3 (lines 184-186), through RETURN-TO-PREV-SCREEN (lines 360-370)
  - to: CPVD
    via: RETURN-TRANSID
    when: every path that displays the detail, COMMAREA passed (lines 202-205)
notes:
  - "Field and record values are right-trimmed, a blank field is \"\". PAUTDTL1 records follow CIPAUDTY and carry their parent's PA-ACCT-ID. AUTHFRDS rows use the AUTHFRDS.ddl column names. Numbers and timestamps in segment and table records are written as Postgres prints them."
  - "CDEMO-CPVD-INFO has the layout of COPAUS0C's CDEMO-CPVS-INFO (lines 110-120), which is how CDEMO-CPVD-PAU-SELECTED receives the selected row's key. Keys are written as <PA-AUTH-DATE-9C>/<PA-AUTH-TIME-9C>, the two packed halves of PA-AUTHORIZATION-KEY."
  - "READ-AUTH-RECORD (lines 431-490) GUs the summary by CDEMO-ACCT-ID and GNPs the detail by key. A missing summary or detail sets AUTHS-EOF and leaves PENDING-AUTH-DETAILS as working storage held it, which POPULATE-AUTH-DETAILS then displays (case COPAUS1C-015). With CDEMO-ACCT-ID not numeric or no selected key, ERR-FLG skips the display and the fields stay LOW-VALUES (lines 210-227)."
  - "Display (lines 291-358). AUTHDTO is PA-AUTH-ORIG-DATE as MM/DD/YY, AUTHTMO PA-AUTH-ORIG-TIME as HH:MM:SS, AUTHAMTO the approved amount in PIC -zzzzzzz9.99. AUTHRSPO is 'A' for response code '00' and 'D' otherwise. AUTHRSNO is the reason code, '-', and its description from WS-DECLINE-REASON-TABLE (lines 56-73), or '9999-ERROR' for a code not in the table. AUTHCDO is the processing code and POSEMDO the POS entry mode, zero-padded. CRDEXPO is the expiry MMYY as MM/YY. AUTHFRDO is the fraud flag, '-' and PA-FRAUD-RPT-DATE when the flag is F or R, otherwise '-'."
  - "PF5 (MARK-AUTH-FRAUD, lines 230-265) re-reads the detail and toggles the flag: F becomes R (remove), anything else becomes F (report). It LINKs to COPAUS2C with the account id, CDEMO-CUST-ID, the toggled detail and the action. COPAUS2C sets PA-FRAUD-RPT-DATE to today as MM/DD/YY in the LINK COMMAREA (lines 91-101) and inserts an AUTHFRDS row (lines 141-198)."
  - "COPAUS2C's AUTH_TS is PA-AUTH-ORIG-DATE as YY-MM-DD with the time 999999999 - PA-AUTH-TIME-9C as HH.MI.SS and milliseconds, through TIMESTAMP_FORMAT 'YY-MM-DD HH24.MI.SSNNNNNN' (lines 103-111, 171-172). The century is the current one. FRAUD_RPT_DATE is CURRENT DATE. ACCT_ID and CUST_ID come from the COMMAREA. A duplicate key (SQLCODE -803) updates only AUTH_FRAUD and FRAUD_RPT_DATE of the existing row (lines 221-244)."
  - "On success COPAUS1C REPLaces the detail with the record COPAUS2C changed, so the segment gets the toggled flag and the report date (lines 520-551), takes a SYNCPOINT and shows 'AUTH MARKED FRAUD...' or 'AUTH FRAUD REMOVED...'. On an SQL failure it shows COPAUS2C's message, rolls back and displays its own copy of the detail, which has the toggled flag but not the new date (case COPAUS1C-012). A failed LINK rolls back with no message."
  - "COPAUS2C's messages begin with a space. WS-SQLCODE is PIC +9(06) and WS-SQLSTATE PIC +9(09), filled from SQLCODE and the five-character SQLSTATE (lines 205-213)."
  - "PF8 (lines 268-288) re-reads the shown detail and GNPs the next one under the summary, which is the next older authorization. At the end it shows 'Already at the last Authorization...' and SENDs without ERASE, so the terminal keeps the detail it showed."
  - "Any other key re-reads and displays the detail with the invalid key message (lines 193-196)."
  - "IMS failures other than not-found build ' System error while ...' messages (lines 452-461, 478-486, 508-517, 538-550, 592-601). The schema cannot inject IMS failures, so no case asserts them."
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COPAUS1C.yaml.
