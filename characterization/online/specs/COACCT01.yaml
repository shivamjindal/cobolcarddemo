          message: "INVALID REQUEST PARAMETERS {}ACCT ID : {WS-KEY}"
          correlation_id: REQ00002
      file_effects: []
    source:
      file: app/app-vsam-mq/cbl/COACCT01.cbl
      lines: [428, 435]

