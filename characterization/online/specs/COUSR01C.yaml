program: COUSR01C
transaction: CU01
screen:
  mapset: COUSR01
  map: COUSR1A
evidence: derived
sources:
  - app/cbl/COUSR01C.cbl
  - app/cpy/CSUSR01Y.cpy
  - app/cpy/COCOM01Y.cpy
  - app/cpy/CSMSG01Y.cpy
  - app/bms/COUSR01.bms
files:
  - name: USRSEC
    ops: [WRITE]
    key: SEC-USR-ID
navigation:
  - to: COSGN00C
    via: XCTL
    when: EIBCALEN = 0 (lines 78-80), COMMAREA passed by RETURN-TO-PREV-SCREEN (lines 165-178)
  - to: COADM01C
    via: XCTL
    when: PF3 (lines 93-95)
  - to: CU01
    via: RETURN-TRANSID
    when: every path that displays the add screen (lines 107-110)
notes:
  - Field and record values are right-trimmed. COBOL pads SEC-USR-ID/SEC-USR-PWD to 8, SEC-USR-FNAME/SEC-USR-LNAME to 20 and SEC-USR-TYPE to 1.
  - Validation order is First Name, Last Name, User ID, Password, User Type (lines 117-151), the order the fields appear on the map. The first failing field wins. Blank means SPACES or LOW-VALUES.
  - "No content validation. User type accepts any non-blank character ('X', lower-case 'a'), not only 'A' or 'U'. User ID and password are stored exactly as typed, with no upper-casing (lines 153-158). COSGN00C upper-cases both typed values before the READ and compare, so a user added here with any lower-case letter in the ID or password can never sign on."
  - "SEC-USR-FILLER (CSUSR01Y.cpy line 23) is never set before the WRITE (lines 240-248). The record carries whatever SEC-USER-DATA held in fresh working storage, typically LOW-VALUES. The file_effects records omit it."
  - The success message is built with SEC-USR-ID DELIMITED BY SPACE (lines 255-258), so an ID containing an embedded space shows only up to that space.
  - "Cursor quirk. On the non-error path, WHEN OTHER sets FNAMEL to -1 (line 149). The DUPKEY/DUPREC branch then also sets USERIDL to -1 (line 264). With SEND ... CURSOR, symbolic cursor positioning puts the cursor on the first field in map order with length -1. FNAME precedes USERID in app/bms/COUSR01.bms (lines 84, 111), so the cursor actually lands on First Name although the code targets User ID. Case COUSR01C-011 asserts FNAMEL, the derived effective position."
  - A VSAM KSDS WRITE with an existing key returns DUPREC. DUPKEY applies only to alternate indexes, and both are handled the same (lines 260-266).
  - "The 'Unable to Add User...' branch (lines 267-273) fires for any other WRITE response. The schema cannot inject a file error, so case COUSR01C-015 states it in the summary only."
  - After a successful add, INITIALIZE-ALL-FIELDS blanks the five input fields and the message and sets the cursor to First Name (lines 286-295). The green success message is then set (lines 253-258).
  - There is no user-type check. Any caller with a COMMAREA can add users, including admins (type 'A').
  - The invalid-key path sets the cursor to First Name (line 100) and redisplays whatever was received, without clearing input.
cases:
  - id: COUSR01C-001
    summary: direct start with no COMMAREA (EIBCALEN = 0) transfers to sign-on
    given:
      entry: first-time
    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      transfer: {via: XCTL, to: COSGN00C}
      commarea:
        CDEMO-TO-PROGRAM: COSGN00C
        CDEMO-FROM-TRANID: CU01
        CDEMO-FROM-PROGRAM: COUSR01C
        CDEMO-PGM-CONTEXT: 0
      file_effects: []
    source:
      file: app/cbl/COUSR01C.cbl
      lines: [78, 80]

  - id: COUSR01C-002
    summary: arriving from the admin menu shows an empty add screen with the cursor on First Name
    given:
