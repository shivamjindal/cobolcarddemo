      commarea: {CDEMO-FROM-PROGRAM: COADM01C, CDEMO-FROM-TRANID: CA00, CDEMO-USER-TYPE: A, CDEMO-PGM-CONTEXT: 0}
    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      cursor: FNAMEL
      fields:
        TRNNAMEO: CU01
        PGMNAMEO: COUSR01C
      transfer: {via: RETURN-TRANSID, to: CU01}
      commarea: {CDEMO-PGM-CONTEXT: 1}
      file_effects: []
    source:
      file: app/cbl/COUSR01C.cbl
      lines: [83, 86]

