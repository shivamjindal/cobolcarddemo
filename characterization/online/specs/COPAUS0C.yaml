navigation:
  - to: COPAUS1C
    via: XCTL
    when: ENTER with 'S' or 's' in the selection field of a listed row (lines 310-324)
  - to: COMEN01C
    via: XCTL
    when: PF3 (lines 235-237, 665-677)
  - to: CPVS
    via: RETURN-TRANSID
    when: every path that displays the list, COMMAREA passed (lines 254-256)
notes:
  - "Field and record values are right-trimmed, a blank field is \"\". PAUTSUM0 and PAUTDTL1 records follow CIPAUSMY and CIPAUDTY, a PAUTDTL1 record also carries its parent's PA-ACCT-ID. Numbers in segment records are written as Postgres prints them (PA-ACCT-ID \"1\")."
  - "CDEMO-CPVS-INFO follows CARDDEMO-COMMAREA (lines 117-126). An authorization key (CDEMO-CPVS-AUTH-KEYS, -PAU-SELECTED, -PAUKEY-LAST, -PAUKEY-PREV-PG) is the 8-byte PA-AUTHORIZATION-KEY, the packed PA-AUTH-DATE-9C and PA-AUTH-TIME-9C. Specs write it as <PA-AUTH-DATE-9C>/<PA-AUTH-TIME-9C>, e.g. 73984/896984999."
  - "Under a summary IMS returns details in key order (DBPAUTP0.dbd, PAUT9CTS). COPAUA0C builds the key from the inverted date and time, so the newest authorization is listed first."
  - "First entry. EIBCALEN = 0 sends an empty list (lines 190-198). A COMMAREA that is not re-entered shows the account in CDEMO-ACCT-ID when it is numeric, otherwise an empty list (lines 202-219). COPAUS1C's PF3 returns with the account it showed. COACTVWC, COCRDLIC and other screens also leave a numeric CDEMO-ACCT-ID that the menu passes through, so the list can open on an account viewed elsewhere."
  - "Account id edit (lines 264-283). ACCTIDI must be all 11 characters numeric. BMS pads a shorter entry with spaces, which fails the NUMERIC test, and zeros are accepted."
  - "GATHER-ACCOUNT-DETAILS (lines 750-808) reads CXACAIX by account id, then ACCTDAT by XREF-ACCT-ID and CUSTDAT by XREF-CUST-ID, then the summary by CDEMO-ACCT-ID. A NOTFND on any of the first three builds 'Account:...' or 'Customer:...' with Resp 000000013 and Reas 000000080 and SENDs the screen at once, then carries on. The terminal keeps the last SEND, which carries the last message STRINGed into WS-MESSAGE. STRING does not clear the rest of WS-MESSAGE."
  - "A NOTFND leaves the record area as it was. After a CXACAIX miss the account and customer reads use whatever CARD-XREF-RECORD held, so the final message and the name, address and limits are undefined (case COPAUS0C-010). After an ACCTDAT miss the limits are undefined, after a CUSTDAT miss the customer id, name, address and phone are. Those cases leave the undefined fields out."
  - "Display formats. CNAMEO is first name up to its first space, a space, the middle initial, a space, last name up to its first space (lines 757-763). ADDR001O is address line 1 and line 2 each up to a double space, joined by ','. ADDR002O is line 3, state and the first 5 zip digits joined by ',' (lines 765-776). CREDLIMO and CREDBALO use PIC -zzzzzzz9.99, CASHLIMO, CASHBALO, APPRAMTO and DECLAMTO PIC -zzzz9.99, the counts PIC 9(03). Without a summary the six summary fields get ZERO, which fills them with '0' characters (lines 800-806)."
  - "Rows (POPULATE-AUTH-LIST, lines 522-605). PDATEnnO is PA-AUTH-ORIG-DATE as MM/DD/YY, PTIMEnnO PA-AUTH-ORIG-TIME as HH:MM:SS, PAPRVnnO 'A' for response code '00' and 'D' otherwise, PSTATnnO the match status, PAMTnnnO the approved amount in PIC -zzzzzzz9.99. A declined authorization lists 0.00. Unused rows are blanked and their selection field protected (lines 608-662)."
  - "Paging (lines 362-453). A page is filled with up to 5 GNPs under the summary. Row 1 of each page is pushed to CDEMO-CPVS-PAUKEY-PREV-PG(page), row 5 or the last row filled is CDEMO-CPVS-PAUKEY-LAST. After 5 rows one more GNP sets CDEMO-CPVS-NEXT-PAGE-FLG. A page that runs out before 5 rows leaves the flag as it was, so a short last page keeps 'Y' and the next PF8 blanks the list (case COPAUS0C-017). The PREV-PG table has 20 entries."
  - "PF7 decrements the page number, repositions on that page's first key and fills forward, but the fill adds 1 back when it reaches row 2 (lines 436-440). The page number therefore never goes down, and a second PF7 shows the same page again (case COPAUS0C-019)."
  - "PF7 and PF8 SEND without ERASE. Fields not sent keep what the terminal showed, so the name and address stay from the previous screen. ENTER and invalid keys SEND with ERASE from the received map, where only FSET fields (rows, limits, balances and amounts) come back. The name, address, phone, customer id and counts go blank after an invalid key or an account id error. The specs assert what the program writes."
  - "An invalid selection sets the message but not WS-ERR-FLG, so the list is rebuilt from page 1 under it (lines 326-337)."
  - "IMS or file errors other than NOTFND build ' System error while ...' messages and SEND. The schema cannot inject IMS failures, so no case asserts them."
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COPAUS0C.yaml.
