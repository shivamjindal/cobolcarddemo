# COTRN01C characterization spec. Derived from reading source, not executed.
# See ../SCHEMA.md. Conventions for values are in `notes`.
program: COTRN01C
transaction: CT01
screen:
  mapset: COTRN01
  map: COTRN1A
evidence: derived
sources: [app/cbl/COTRN01C.cbl, app/bms/COTRN01.bms, app/cpy-bms/COTRN01.CPY, app/cpy/COCOM01Y.cpy, app/cpy/CVTRA05Y.cpy,
  app/cpy/CSDAT01Y.cpy, app/cpy/CSMSG01Y.cpy, app/csd/CARDDEMO.CSD]
files:
- name: TRANSACT
  ops: [READ-UPDATE]
  key: TRAN-ID
navigation:
- to: COSGN00C
  via: XCTL
  when: started without a COMMAREA (EIBCALEN = 0), lines 94-96
- to: COTRN00C
  via: XCTL
  when: PF3 when CDEMO-FROM-PROGRAM is COTRN00C (lines 115-122), or PF5 always (lines 125-127)
- to: COMEN01C
  via: XCTL
  when: PF3 when CDEMO-FROM-PROGRAM is COMEN01C or blank, lines 115-122
- to: CT01
  via: RETURN-TRANSID
  when: every screen send, lines 135-138
notes: ['Value conventions: field and record values are shown without trailing pad spaces; "" means the field is
    all spaces or LOW-VALUES. Numeric record fields are written as decimal strings (e.g. TRAN-AMT "12.50"). Input
    values are the full field content as BMS delivers it: default JUSTIFY=(LEFT,BLANK) pads short input with trailing
    spaces, which is why several IS NUMERIC checks reject short entries.', 'A {NAME} placeholder inside a message
    or a record value is a runtime value. {} marks the seam between two adjacent STRING literals and renders as
    the empty string, because the schema''s fragment check cannot match two literals that the COBOL concatenates
    with no variable between them. A runner should treat {NAME} and {} as wildcards. This is the same convention
    COACTVWC.yaml uses.', 'CICS RESP branches other than NORMAL/NOTFND/ENDFILE/DUPKEY (I/O errors, DISABLED files)
    cannot be set up through `given.files`, so they are listed here instead of as cases.', 'PF3 transfers to whatever
    program CDEMO-FROM-PROGRAM names (lines 116-121). The navigation list shows the two callers that exist in this
    repo: COTRN00C (selection) and COMEN01C (menu option).', 'CDEMO-CT01-INFO (lines 53-61) has the same layout
    as COTRN00C''s CDEMO-CT00-INFO, so CDEMO-CT01-TRN-SELECTED receives COTRN00C''s CDEMO-CT00-TRN-SELECTED.', 'The
    READ uses UPDATE (line 274) but the program never REWRITEs or UNLOCKs. The record lock is held until the task''s
    RETURN, so a view briefly blocks concurrent updaters. A Java slice should do a plain read.', 'On arrival with
    a selected id, PROCESS-ENTER-KEY sends the screen (line 191 or 287) and line 109 sends it again with the same
    content. The terminal shows the second send.', 'TRAN-ORIG-TS and TRAN-PROC-TS are X(26) moved into X(10) fields,
    so only YYYY-MM-DD is shown (lines 184-185). TRAN-DESC X(100) is cut to 60 characters and TRAN-MERCHANT-NAME/CITY
    X(50) to 30/25.', 'WS-USR-MODIFIED, CDEMO-CT01-TRNID-FIRST/LAST/PAGE-NUM are declared and never used.', 'The
    OTHER branch sets no cursor field (lines 128-131). The cursor position after that SEND CURSOR depends on BMS
    defaults, so the case does not assert one.', 'I/O error branch: a READ RESP other than NORMAL or NOTFND shows
    ''Unable to lookup Transaction...'' with the cursor on TRNIDINL (lines 288-295).', 'The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COTRN01C.yaml.']
