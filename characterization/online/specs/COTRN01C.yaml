      TRANSACT:
      - TRAN-ID: '0000000000000003'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '0001'
        TRAN-SOURCE: POS TERM
        TRAN-DESC: PURCHASE 03
        TRAN-AMT: '12.34'
        TRAN-MERCHANT-ID: '000012345'
        TRAN-MERCHANT-NAME: JOES COFFEE
        TRAN-MERCHANT-CITY: SEATTLE
        TRAN-MERCHANT-ZIP: '98101'
        TRAN-CARD-NUM: '4111111111111111'
        TRAN-ORIG-TS: '2022-06-03 10:00:00.000000'
        TRAN-PROC-TS: '2022-06-04 09:30:00.000000'
  when:
    aid: ENTER
  then:
    message: null
    cursor: TRNIDINL
    fields:
      TRNIDINO: '0000000000000003'
      TRNIDO: '0000000000000003'
      CARDNUMO: '4111111111111111'
      TTYPCDO: '01'
      TCATCDO: '0001'
      TRNSRCO: POS TERM
      TRNAMTO: '+00000012.34'
      TDESCO: PURCHASE 03
      TORIGDTO: '2022-06-03'
      TPROCDTO: '2022-06-04'
      MIDO: '000012345'
      MNAMEO: JOES COFFEE
      MCITYO: SEATTLE
      MZIPO: '98101'
    transfer:
      via: RETURN-TRANSID
      to: CT01
    commarea:
      CDEMO-PGM-CONTEXT: 1
    file_effects: []
  source:
    file: app/cbl/COTRN01C.cbl
    lines: [103, 108]
