      TRANSACT:
      - {TRAN-ID: '0000000000000022', TRAN-TYPE-CD: '01', TRAN-CAT-CD: '0001', TRAN-AMT: '22.00'}
  when:
    aid: ENTER
    fields:
      ACTIDINI: '00000000001'
      CONFIRMI: 'Y'
  then:
    message: Payment successful. {} Your Transaction ID is {TRAN-ID}.
    cursor: ACTIDINL
    fields:
      ACTIDINO: ''
      CURBALO: ''
      CONFIRMO: ''
    transfer:
      via: RETURN-TRANSID
      to: CB00
    file_effects:
    - file: TRANSACT
      op: WRITE
      record:
        TRAN-ID: '0000000000000023'
        TRAN-TYPE-CD: '02'
        TRAN-CAT-CD: '0002'
        TRAN-SOURCE: POS TERM
        TRAN-DESC: BILL PAYMENT - ONLINE
        TRAN-AMT: '1500.75'
        TRAN-MERCHANT-ID: '999999999'
        TRAN-MERCHANT-NAME: BILL PAYMENT
