# COBIL00C characterization spec. Derived from reading source, not executed.
# See ../SCHEMA.md. Conventions for values are in `notes`.
program: COBIL00C
transaction: CB00
screen:
  mapset: COBIL00
  map: COBIL0A
evidence: derived
sources: [app/cbl/COBIL00C.cbl, app/bms/COBIL00.bms, app/cpy-bms/COBIL00.CPY, app/cpy/COCOM01Y.cpy, app/cpy/CVACT01Y.cpy,
  app/cpy/CVACT03Y.cpy, app/cpy/CVTRA05Y.cpy, app/cpy/CSDAT01Y.cpy, app/cpy/CSMSG01Y.cpy, app/csd/CARDDEMO.CSD]
files:
- name: ACCTDAT
  ops: [READ-UPDATE, REWRITE]
  key: ACCT-ID
- name: CXACAIX
  ops: [READ]
  key: XREF-ACCT-ID
- name: TRANSACT
  ops: [STARTBR, READPREV, ENDBR, WRITE]
  key: TRAN-ID
navigation:
- to: COSGN00C
  via: XCTL
  when: started without a COMMAREA (EIBCALEN = 0), lines 106-108
- to: COMEN01C
  via: XCTL
  when: PF3; goes to CDEMO-FROM-PROGRAM, COMEN01C when blank (the menu is the only caller), lines 128-135
- to: CB00
  via: RETURN-TRANSID
  when: end of every task, lines 146-149
notes: ['Value conventions: field and record values are shown without trailing pad spaces; "" means the field is
    all spaces or LOW-VALUES. Numeric record fields are written as decimal strings (e.g. TRAN-AMT "12.50"). Input
    values are the full field content as BMS delivers it: default JUSTIFY=(LEFT,BLANK) pads short input with trailing
    spaces, which is why several IS NUMERIC checks reject short entries.', 'A {NAME} placeholder inside a message
    or a record value is a runtime value. {} marks the seam between two adjacent STRING literals and renders as
    the empty string, because the schema''s fragment check cannot match two literals that the COBOL concatenates
    with no variable between them. A runner should treat {NAME} and {} as wildcards. This is the same convention
    COACTVWC.yaml uses.', 'CICS RESP branches other than NORMAL/NOTFND/ENDFILE/DUPKEY (I/O errors, DISABLED files)
    cannot be set up through `given.files`, so they are listed here instead of as cases.', 'Unlike COTRN02C, SEND-BILLPAY-SCREEN
    (lines 288-301) does not RETURN, so processing continues after an error send. Several sends can happen in one
    task, and the terminal shows the last one.', 'Latent bug (lines 210-236): after READ-CXACAIX-FILE the error
    flag is never re-checked. If the account has no xref record, or the NONUNIQUEKEY AIX returns DUPKEY for an account
    with several cards (app/jcl/XREFFILE.jcl line 75), the error is sent but the WRITE and REWRITE still run. The
    WRITE''s success message then overwrites the screen. On NOTFND, TRAN-CARD-NUM comes from an uninitialised CARD-XREF-RECORD.
    On DUPKEY, CICS still returns the first card''s record.', 'The payment always equals the full current balance
    (line 224 TRAN-AMT = ACCT-CURR-BAL), and the new balance is ACCT-CURR-BAL - TRAN-AMT (line 234). TRAN-AMT is
    S9(09)V99 while ACCT-CURR-BAL is S9(10)V99. A balance of 1,000,000,000.00 or more loses its high-order digit
    in TRAN-AMT, and the account keeps that remainder.', 'Payment record (lines 218-232): INITIALIZE TRAN-RECORD;
    TRAN-ID = last TRAN-ID + 1 (STARTBR HIGH-VALUES, READPREV, ENDBR, lines 212-217); TRAN-TYPE-CD ''02''; TRAN-CAT-CD
    2 (0002); TRAN-SOURCE ''POS TERM''; TRAN-DESC ''BILL PAYMENT - ONLINE''; TRAN-AMT = balance; TRAN-CARD-NUM =
    XREF-CARD-NUM; TRAN-MERCHANT-ID 999999999; TRAN-MERCHANT-NAME ''BILL PAYMENT''; TRAN-MERCHANT-CITY and ZIP ''N/A''.
    TRAN-ORIG-TS and TRAN-PROC-TS both get the CICS ASKTIME/FORMATTIME timestamp ''YYYY-MM-DD HH:MM:SS.000000''
    (lines 249-266). The fraction is always zero.', 'Success message: green (ERRMSGC = DFHGREEN, line 526). It renders
    as ''Payment successful.  Your Transaction ID is 0000000000000023.'', with two spaces after the first period.
    WRITE-TRANSACT-FILE sends it (line 532) and line 242 sends it again after the REWRITE.', 'Ordering: the TRANSACT
    WRITE happens before the ACCTDAT REWRITE, and there is no SYNCPOINT or error rollback in the program. If the
    REWRITE fails (''Unable to Update Account...'', lines 396-402), the payment record stays written. Whether CICS
    backs it out depends on the file''s recovery attributes, and the CSD defines RECOVERY(NONE).', 'ACCTDAT is read
    with UPDATE (line 351) even when only showing the balance (confirmation blank), so the record is locked until
    the task''s RETURN.', 'The confirmation is evaluated before the balance check. ''N'' or ''n'' clears the screen
    and sets the error flag, with no message (lines 178-181). Blank or LOW-VALUES reads the account and asks to
    confirm. Any other value is rejected without reading ACCTDAT. For both ''N'' and invalid values, lines 192-193
    then move the never-read ACCT-CURR-BAL into CURBALI after the screen was already sent, which has no visible
    effect.', 'Account id is not validated as numeric. ACTIDINI X(11) is moved straight into ACCT-ID 9(11) and XREF-ACCT-ID
    (line 170). Short or non-numeric input most likely misses on READ and shows ''Account ID NOT found...''. This
    is inferred, not traced.', 'Arrival with CDEMO-CB00-TRN-SELECTED (lines 116-121) prefills the account and runs
    ENTER processing, then line 122 sends the screen a second time. No program in this repo XCTLs here with that
    field set.', 'I/O error branches: ACCTDAT READ ''Unable to lookup Account...'' (lines 365-371); REWRITE NOTFND
    ''Account ID NOT found...'', other ''Unable to Update Account...'' (390-402); CXACAIX other ''Unable to lookup
    XREF AIX file...'' (429-436); STARTBR NOTFND ''Transaction ID NOT found...'', other ''Unable to lookup Transaction...''
    (454-466, 488-495); WRITE DUPKEY/DUPREC ''Tran ID already exist...'', other ''Unable to Add Bill pay Transaction...''
    (533-546). All put the cursor on ACTIDINL. None of them stops the rest of the payment path.']
