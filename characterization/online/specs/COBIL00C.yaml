- id: COBIL00C-015
  summary: 'confirmation ''Y'' pays the full balance: a type 02 / category 2 transaction is written with id = last
    + 1, and the account balance is rewritten as balance - amount (0.00)'
  given:
    entry: reenter
    commarea:
      CDEMO-PGM-CONTEXT: 1
      CDEMO-FROM-PROGRAM: COMEN01C
    files:
      ACCTDAT:
      - {ACCT-ID: '00000000001', ACCT-ACTIVE-STATUS: 'Y', ACCT-CURR-BAL: '1500.75', ACCT-CREDIT-LIMIT: '5000.00'}
      - {ACCT-ID: '00000000002', ACCT-ACTIVE-STATUS: 'Y', ACCT-CURR-BAL: '0.00', ACCT-CREDIT-LIMIT: '5000.00'}
      - {ACCT-ID: '00000000003', ACCT-ACTIVE-STATUS: 'Y', ACCT-CURR-BAL: '-10.00', ACCT-CREDIT-LIMIT: '5000.00'}
      CXACAIX:
