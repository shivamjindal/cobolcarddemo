program: COACTVWC
transaction: CAVW
screen:
  mapset: COACTVW
  map: CACTVWA
evidence: derived
sources:
  - app/cbl/COACTVWC.cbl
  - app/bms/COACTVW.bms
  - app/cpy-bms/COACTVW.CPY
  - app/cpy/COCOM01Y.cpy
  - app/cpy/CVCRD01Y.cpy
  - app/cpy/CSSTRPFY.cpy
  - app/cpy/CVACT01Y.cpy
  - app/cpy/CVACT03Y.cpy
  - app/cpy/CVCUS01Y.cpy
  - app/csd/CARDDEMO.CSD
files:
  - name: CXACAIX
    ops: [READ]
    key: XREF-ACCT-ID
  - name: ACCTDAT
    ops: [READ]
    key: ACCT-ID
  - name: CUSTDAT
    ops: [READ]
    key: CUST-ID
navigation:
  - to: COMEN01C
    via: XCTL
    when: >-
      PF3 (or PF15). The target is CDEMO-FROM-PROGRAM when it is set (lines 337-338), else COMEN01C (lines
      334-336). Any calling program can therefore be the target. COMEN01C is the only one the menu wires
      up (COMEN02Y option for COACTVWC).
  - to: CAVW
    via: RETURN-TRANSID
    when: every path that sends the map ends at COMMON-RETURN (lines 394-407)
  - to: COACTVWC
    via: SEND-TEXT
    when: CDEMO-PGM-CONTEXT is neither 0 nor 1; plain text 'UNEXPECTED DATA SCENARIO' then RETURN without TRANSID (lines 375-382, 876-886)
notes:
  - >-
    Derived from source, never executed. Line numbers refer to app/cbl/COACTVWC.cbl unless a case cites another file.
  - >-
    Message conventions. then.message is grounded in the source text. {NAME} is a runtime value, and {} marks
    a join between two adjacent STRING literals with nothing in between, e.g. ' not found in' ' Cross ref file.'
    (lines 750-751). A runner should treat {NAME} and {} as wildcards. WS-RETURN-MSG is PIC X(75) and is copied
    into ERRMSGO (X(78)), so compare right-trimmed. message null means WS-RETURN-MSG was spaces.
  - >-
    Input conventions. A when.fields value of "" means the field came back blank (spaces or low-values; both
    are treated alike at lines 628-633). given.entry first-time means EIBCALEN = 0. xctl-from means
    CDEMO-PGM-CONTEXT = 0 (CDEMO-PGM-ENTER). reenter means CDEMO-PGM-CONTEXT = 1.
  - >-
    Info line. INFOMSGO always shows 'Enter or update id of account to display'. 9000-READ-ACCT clears
    WS-INFO-MSG (line 689) and 1200 then sets the prompt again whenever WS-INFO-MSG is empty (lines 528-530).
    The 88 WS-INFORM-OUTPUT 'Displaying details of given Account' (line 115) is never set, so even a
    successful lookup does not show it.
  - >-
    AID handling (lines 306-314). Only ENTER and PF3 are valid. Any other key, including PF5, PF12 and CLEAR,
    is treated as ENTER. CSSTRPFY folds PF13-PF24 onto PF1-PF12, so PF15 acts as PF3. CLEAR and PA keys send
    no data, so RECEIVE MAP gets MAPFAIL. The RESP is captured but never checked (lines 611-617), and ACCTSIDI
    then holds whatever was in the map storage. That outcome is not specified here.
  - >-
    Quirk at lines 282-283. The test 'CDEMO-FROM-PROGRAM = LIT-MENUPGM AND NOT CDEMO-PGM-REENTER' runs before
    the incoming COMMAREA is copied to CARDDEMO-COMMAREA (line 288). It therefore tests working-storage that
    has no VALUE clause, not the caller's data. In practice the ELSE branch copies the COMMAREA, and the result
    matches what the comment intends because the menu sends CDEMO-PGM-CONTEXT = 0.
  - >-
    Quirk at lines 289-292. WS-THIS-PROGCOMMAREA is copied from the bytes after CARDDEMO-COMMAREA, but callers
    such as COMEN01C pass only CARDDEMO-COMMAREA. The copy reads past EIBCALEN. Those fields (CA-FROM-PROGRAM,
    CA-FROM-TRANID) are never used afterwards.
  - >-
    Quirk. A CDEMO-ACCT-ID passed in by the caller is ignored on arrival. ACCTSIDO is blank on the first screen
    (lines 465-466, the edit flag is blank after INITIALIZE).
  - >-
    Account id edit (lines 649-681). The id must be exactly 11 numeric characters and not all zeros. BMS input
    is left-justified and space-padded, so a short number such as 12345 fails the NUMERIC test. The message is
    'Account Filter must  be a non-zero 11 digit number' with two spaces after 'must' (line 672). The 88s
    SEARCHED-ACCT-ZEROES and SEARCHED-ACCT-NOT-NUMERIC (lines 124-127) are never used.
  - >-
    Blank account id (lines 652-661, 640-642). 2210 sets 'Account number not provided', and 2200 then
    overwrites it with 'No input received'. The user sees 'No input received', ACCTSIDO shows '*', and the
    field is red (lines 561-565).
  - >-
    The ACCTSIDC color is not in the schema. It is red (DFHRED) when the filter is not OK or blank on reenter
    (lines 557-565) and default color otherwise. The cursor is on ACCTSIDL in every outcome (lines 546-552,
    both EVALUATE branches do the same thing).
  - >-
    Latent bug at lines 703-705 and 713-715. DID-NOT-FIND-ACCT-IN-ACCTDAT and DID-NOT-FIND-CUST-IN-CUSTDAT are
    never set, because the SETs at 791 and 842 are commented out. After an ACCTDAT NOTFND the program still
    reads CUSTDAT with the xref customer id. If the customer exists, FOUND-CUST-IN-MASTER makes 1200 display
    the customer fields and also the ACCT-* fields from an ACCOUNT-RECORD that was not loaded on this task
    (lines 471-490). The ACCTDAT error message stays on screen.
  - >-
    RESP rendering is inferred, not observed. ERROR-RESP and ERROR-RESP2 are PIC X(10) receiving S9(9) COMP
    values. Standard MOVE rules give 9 digits plus a trailing space, e.g. '000000013 ' for NOTFND (RESP 13).
    The three not-found messages are longer than WS-RETURN-MSG (75 bytes), so the tail of the RESP2 value is
    cut off.
  - >-
    Fault injection. Cases whose summary says 'READ returns a RESP other than NORMAL/NOTFND' force an I/O
    error on that dataset with given.file_conditions (see SCHEMA.md).
  - >-
    Display formatting. Amounts use BMS PICOUT '+ZZZ,ZZZ,ZZZ.99' (COACTVW.bms lines 120-195; ACURBALO etc.
    are PIC +ZZZ,ZZZ,ZZZ.99 in COACTVW.CPY). SSN shows as NNN-NN-NNNN (lines 496-504). ACSZIPCO is X(5) and
    ACSPHN1O/ACSPHN2O are X(13), so longer stored values are truncated on the right.
  - >-
    PF3 always sets CDEMO-USER-TYPE to 'U' (line 343), even when an admin arrived here. The caller's user
    type is lost.
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COACTVWC.yaml.
