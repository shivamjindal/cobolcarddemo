      commarea: {}
    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      cursor: ACCTSIDL
      fields:
        INFOMSGO: Enter or update id of account to display
        TRNNAMEO: CAVW
        PGMNAMEO: COACTVWC
      transfer: {via: RETURN-TRANSID, to: CAVW}
      commarea: {CDEMO-PGM-CONTEXT: 1}
      file_effects: []
    source:
