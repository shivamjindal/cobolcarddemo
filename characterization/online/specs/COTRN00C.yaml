# COTRN00C characterization spec. Derived from reading source, not executed.
# See ../SCHEMA.md. Conventions for values are in `notes`.
program: COTRN00C
transaction: CT00
screen:
  mapset: COTRN00
  map: COTRN0A
evidence: derived
sources: [app/cbl/COTRN00C.cbl, app/bms/COTRN00.bms, app/cpy-bms/COTRN00.CPY, app/cpy/COCOM01Y.cpy, app/cpy/CVTRA05Y.cpy,
  app/cpy/CSDAT01Y.cpy, app/cpy/CSMSG01Y.cpy, app/csd/CARDDEMO.CSD]
files:
- name: TRANSACT
  ops: [STARTBR, READNEXT, READPREV, ENDBR]
  key: TRAN-ID
navigation:
- to: COSGN00C
  via: XCTL
  when: started without a COMMAREA (EIBCALEN = 0), lines 106-108
- to: COMEN01C
  via: XCTL
  when: PF3, lines 122-124
- to: COTRN01C
  via: XCTL
  when: ENTER with 'S' or 's' beside a listed transaction, lines 183-195
- to: CT00
  via: RETURN-TRANSID
  when: every screen send, lines 138-141
notes: ['Value conventions: field and record values are shown without trailing pad spaces; "" means the field is
    all spaces or LOW-VALUES. Numeric record fields are written as decimal strings (e.g. TRAN-AMT "12.50"). Input
    values are the full field content as BMS delivers it: default JUSTIFY=(LEFT,BLANK) pads short input with trailing
    spaces, which is why several IS NUMERIC checks reject short entries.', 'A {NAME} placeholder inside a message
    or a record value is a runtime value. {} marks the seam between two adjacent STRING literals and renders as
    the empty string, because the schema''s fragment check cannot match two literals that the COBOL concatenates
    with no variable between them. A runner should treat {NAME} and {} as wildcards. This is the same convention
    COACTVWC.yaml uses.', 'CICS RESP branches other than NORMAL/NOTFND/ENDFILE/DUPKEY (I/O errors, DISABLED files)
    cannot be set up through `given.files`, so they are listed here instead of as cases.', 'CDEMO-CT00-INFO (lines
    62-70) is appended to CARDDEMO-COMMAREA, so the paging state travels in the COMMAREA. Arriving from COMEN01C,
    whose COMMAREA is only COCOM01Y, line 111 pads it with spaces.', 'Each list row shows TRAN-ID, TRAN-ORIG-TS
    reformatted to MM/DD/YY, the first 26 characters of TRAN-DESC, and TRAN-AMT edited as +99999999.99 (lines 383-388,
    391-395). PAGENUMO is the PIC 9(08) page counter moved to an X(08) field, so page 1 displays as 00000001 (line
    324).', 'Paging: PF8 starts the browse at CDEMO-CT00-TRNID-LAST and PF7 at CDEMO-CT00-TRNID-FIRST. The first
    READNEXT or READPREV re-reads that boundary record and discards it (lines 284-286, 339-341). A look-ahead read
    after the 10th row sets NEXT-PAGE-FLG (lines 305-313) or decides the page number on the way back (lines 359-368).',
  'Latent bug: the discard read at line 284 is skipped only for ENTER, PF7 and PF3. When COTRN01C transfers here
    on PF5, EIBAID is still PF5, so the first record of the file is skipped on the first list (case COTRN00C-005).',
  'Latent bug: on a partial last page the rows past the end are blanked, but CDEMO-CT00-TRNID-LAST keeps the previous
    page''s last id, because only row 10 sets it (lines 437-439).', 'Messages are sent and the program keeps going.
    SEND-TRNLST-SCREEN can run two or three times in one task, and the screen shows the last SEND. WS-MESSAGE persists
    across those sends, which is why ''You have reached the bottom of the page...'' appears on the final list screen.',
  'The ERASE is suppressed only for the two ''already at the top/bottom'' messages (lines 250, 272), so those leave
    the previous rows on the terminal.', 'Selection scans SEL0001I..SEL0010I in order and the first non-blank one
    wins (lines 148-181). ''S'' or ''s'' beside a row whose TRNIDnnI is blank does nothing, and the list is re-read.',
  'STARTBR is coded without GTEQ (the option is commented out at line 597). CICS defaults to GTEQ, so a search id
    that is not on file starts at the next higher key.', 'Unverified runtime behavior: when no key >= the start
    key exists (empty file, or a search id past the last record), STARTBR returns NOTFND. Lines 606-611 send ''You
    are at the top of the page...'' without setting the error flag, then PROCESS-PAGE-FORWARD issues ENDBR with
    no active browse and no RESP option (lines 693-695). CICS would raise INVREQ there, which likely abends the
    task.', 'I/O error branches: a STARTBR, READNEXT or READPREV RESP other than NORMAL, NOTFND or ENDFILE shows
    ''Unable to lookup transaction...'' with the cursor on TRNIDINL (lines 612-618, 646-652, 680-686).']
