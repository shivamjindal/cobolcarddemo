program: COACTUPC
transaction: CAUP
screen:
  mapset: COACTUP
  map: CACTUPA
evidence: derived
sources:
  - app/cbl/COACTUPC.cbl
  - app/bms/COACTUP.bms
  - app/cpy-bms/COACTUP.CPY
  - app/cpy/COCOM01Y.cpy
  - app/cpy/CVCRD01Y.cpy
  - app/cpy/CSSTRPFY.cpy
  - app/cpy/CVACT01Y.cpy
  - app/cpy/CVACT03Y.cpy
  - app/cpy/CVCUS01Y.cpy
  - app/cpy/CSUTLDPY.cpy
  - app/cpy/CSUTLDWY.cpy
  - app/cpy/CSLKPCDY.cpy
  - app/cpy/CSSETATY.cpy
  - app/cpy/CSMSG02Y.cpy
  - app/csd/CARDDEMO.CSD
files:
  - name: CXACAIX
    ops: [READ]
    key: XREF-ACCT-ID
  - name: ACCTDAT
    ops: [READ, READ-UPDATE, REWRITE]
    key: ACCT-ID
  - name: CUSTDAT
    ops: [READ, READ-UPDATE, REWRITE]
    key: CUST-ID
navigation:
  - to: COMEN01C
    via: XCTL
    when: >-
      PF3 (or PF15) in any state, after EXEC CICS SYNCPOINT (lines 927-959). The target is CDEMO-FROM-PROGRAM
      when it is set, else COMEN01C. COMEN01C is the only caller the menu wires up (COMEN02Y option for
      COACTUPC).
  - to: CAUP
    via: RETURN-TRANSID
    when: every path that sends the map ends at COMMON-RETURN (lines 1007-1019)
  - to: COACTUPC
    via: SEND-TEXT
    when: >-
      2000-DECIDE-ACTION WHEN OTHER (lines 2633-2640). ABEND-ROUTINE sends ABEND-DATA with EXEC CICS SEND (not
      SEND TEXT) and then issues EXEC CICS ABEND ABCODE('9999') (lines 4203-4225). SEND-TEXT is the closest
      'via' the schema offers.
notes:
  - >-
    Derived from source, never executed. Line numbers refer to app/cbl/COACTUPC.cbl unless a case cites
    another file. Date edits live in app/cpy/CSUTLDPY.cpy (COPY at line 4232).
  - >-
    STATE MACHINE. The state is ACUP-CHANGE-ACTION in the program part of the COMMAREA (lines 654-668), set
    per case in given.commarea. A value of "" means LOW-VALUES or SPACES. The states are:
    "" = ACUP-DETAILS-NOT-FETCHED (search mode; only ACCTSIDI is read, lines 1060-1062).
    S = ACUP-SHOW-DETAILS (record shown; fields unprotected except ACCTSID, ACSTNUM and ACSCTRY).
    E = ACUP-CHANGES-NOT-OK (changes failed validation).
    N = ACUP-CHANGES-OK-NOT-CONFIRMED (validated; fields protected; F5 saves).
    C = ACUP-CHANGES-OKAYED-AND-DONE (saved).
    L = ACUP-CHANGES-OKAYED-LOCK-ERROR (READ UPDATE of ACCTDAT failed).
    F = ACUP-CHANGES-OKAYED-BUT-FAILED (REWRITE failed).
  - >-
    TRANSITIONS. "" + ENTER with a valid account that is found goes to S (2568-2580). In S or E, ENTER first
    compares the screen with the values fetched (1205). With no difference it stays in the same state and shows
    'No change detected with respect to values fetched.'. With a difference it validates every field
    (1470-1669) and goes to E (first error) or N (all valid, 1671-1675). In N, ENTER stays in N (edits are
    skipped, 1463-1467). In N, PF5 runs 9600-WRITE-PROCESSING and goes to C on success, L on account lock
    failure, F on rewrite failure, or back to S when the record changed (2602-2615). Any key except PF3 in C,
    L or F resets to a blank search screen in state "" (979-989). PF12 in any state except "" re-reads the
    record and goes to S, discarding unsaved changes (2572-2580).
  - >-
    AID validity (lines 905-916). Always valid are ENTER and PF3. PF5 is valid only in state N, and PF12 in
    any state except "". Every other key, and PF5 or PF12 outside those states, is treated as ENTER.
    CSSTRPFY folds PF13-PF24 onto PF1-PF12. CLEAR and PA keys send no data, so RECEIVE MAP gets MAPFAIL. RESP
    is captured but never checked (lines 1040-1045). That outcome is not specified here.
  - >-
    Message conventions. then.message is grounded in source text. {NAME} is a runtime value, and {} marks a
    join between adjacent STRING literals with nothing in between (e.g. lines 1807-1808). The validator only
    accepts literal source fragments, so most field-edit messages appear as the template
    '{WS-EDIT-VARIABLE-NAME} ...'. then.fields.ERRMSGO carries the fully resolved text the user sees, e.g.
    'Credit Limit must be supplied.'. Compare it right-trimmed (WS-RETURN-MSG X(75) goes into ERRMSGO X(78)).
    message null means WS-RETURN-MSG was spaces.
  - >-
    Only the first error message is kept. Every edit is guarded by IF WS-RETURN-MSG-OFF, so the message comes
    from the first failing field in edit order (1472-1662). The order is Account Status, Open Date, Credit
    Limit, Expiry Date, Cash Credit Limit, Reissue Date, Current Balance, Current Cycle Credit, Current Cycle
    Debit, SSN parts 1-3, Date of Birth, FICO, First/Middle/Last Name, Address Line 1, State, Zip, City,
    Country, Phone 1, Phone 2, EFT Account Id, Primary Card Holder, then the state/zip cross check
    (1665-1669). The cursor is chosen separately by the first flagged field in screen order (3009-3167).
    The two orders agree except for the state/zip cross check, which runs last but puts the cursor on State
    (see case COACTUPC-112).
  - >-
    Error marking (CSSETATY, COPY at lines 3208-3435). On reenter, a field whose flag is NOT-OK or BLANK is
    shown red. A BLANK one also shows '*' in its output field. Colors and attribute bytes (protection, the F5
    and F12 key labels brightened at 3573-3581) are not expressible in the schema and are only noted here.
  - >-
    Input conventions. A when.fields value of "" means blank. 1100-RECEIVE-MAP turns '*' or spaces into
    LOW-VALUES (lines 1051-1424). Amount fields accept anything FUNCTION TEST-NUMVAL-C accepts (sign, '$',
    commas, decimals). Screens are 3270 and space-padded, so short numeric input in the SSN, zip, FICO, EFT
    and phone parts fails the 'all numeric' / 'A n digit number' checks. Unless a case says otherwise, every
    input field equals what the fetch displayed (anchor 'screen' in case COACTUPC-019).
  - >-
    Case-insensitive change detection (1205, lines 1684-1773). Status, group id and most customer text fields
    are compared after UPPER-CASE/TRIM. A change in letter case alone (e.g. state 'NY' to 'ny', status 'Y' to
    'y') therefore counts as 'no change', and the lowercase value is never saved. The validations themselves
    are case-sensitive: 'y' fails Y/N and 'ny' fails the state table.
  - >-
    No business range checks beyond what is listed. A credit limit may be negative or smaller than the cash
    limit or balance. Expiry and reissue dates are not required to be in the future or after the open date.
    Group id (AADDGRP), Address Line 2 and Government id (ACSGOVT) are never validated. Customer id is
    protected (DFHBMPRF line 3531). Country is protected (line 3547) but still validated as 1-3 alphabetic
    characters. The account id is protected once details are shown (3310 protects it and 3320 does not
    unprotect it), so a different account can only be searched after PF3 or after a save attempt ends in
    C, L or F.
  - >-
    Dates (CSUTLDPY). Only centuries 19 and 20 are accepted. Year, month and day are each checked, and all
    three are always evaluated. Then come the 31-day-month check, the February 30 check and the leap-year
    check. For the leap year, years ending 00 must divide by 400, others by 4 (CSUTLDPY lines 243-272). This
    is correct for 1900-2099. A day or month error found by the cross checks flags both month and day (and
    year for the leap-year error), so the cursor lands on the earliest of those in screen order. If all
    parts pass, the date is also checked by CALL 'CSUTLDTC' (CEEDAYS, CSUTLDPY lines 283-321). A failure there
    sets an error message, but the fall-through at CSUTLDPY line 327 then resets the date flags to valid, so
    no field is marked. Date of Birth must also be strictly before today (CSUTLDPY lines 341-369), so a
    birth date of today is rejected.
  - >-
    Masked latent bug in the phone 'all blank' test (lines 2234-2239). The third clause tests NUMA = SPACES
    where NUMC was intended. A blank screen field always arrives as LOW-VALUES (line 1359), never SPACES, so
    the clause reduces to NUMC = LOW-VALUES and the test behaves as intended (see COACTUPC-104). A Java port
    that feeds spaces into this logic would expose the bug.
  - >-
    Phone, SSN parts and blanks as written (9600, lines 4027-4041). Phones are saved as '(AAA)BBB-CCCC' padded
    to 15. An all-blank phone (accepted, optional) is saved as '(' + 3 x LOW-VALUES + ')' + 3 x LOW-VALUES +
    '-' + 4 x LOW-VALUES. A blank optional field (middle name, address line 2, government id) is saved as
    LOW-VALUES, not spaces. Text is saved exactly as typed, with no upper-casing.
  - >-
    LATENT BUG, account record layout (lines 418-433 vs CVACT01Y). ACCT-UPDATE-RECORD has no ACCT-ADDR-ZIP
    field, and its FILLER is X(188) where CVACT01Y has X(178). The REWRITE therefore puts the new group id in
    the bytes CVACT01Y calls ACCT-ADDR-ZIP (offsets 103-112). The bytes CVACT01Y calls ACCT-GROUP-ID
    (113-122) receive FILLER, which INITIALIZE does not touch, so their content depends on how working
    storage was initialized. The REWRITE case asserts ACCT-ADDR-ZIP = new group id and asserts nothing about
    ACCT-GROUP-ID. The next fetch reads that FILLER back as the group id.
  - >-
    LATENT BUG, customer lock failure is reported as success (lines 2606-2615). When READ UPDATE of CUSTDAT
    fails, 9600 sets 'Could not lock customer record for update', but the EVALUATE has no branch for it and
    falls to WHEN OTHER, giving state C. The info line says 'Changes committed to database' although nothing
    was written. The ACCTDAT record stays locked until the task ends.
  - >-
    LATENT BUG, account missing but customer present (9000, lines 3624-3643). DID-NOT-FIND-ACCT-IN-ACCTDAT is
    never set (the 9300 NOTFND branch sets only the error text). After an ACCTDAT NOTFND or any other ACCTDAT
    READ error, 9400 still reads the customer. If the customer exists, 9500 stores ACCT-* values from an
    ACCOUNT-RECORD that was not loaded on this task, and 2577-2579 moves to state S with the ACCTDAT error
    message on screen.
  - >-
    Concurrent update (9700, lines 4109-4191). The DB record is compared with the ACUP-OLD-* values in the
    COMMAREA. Account fields are compared exactly, except group id which is compared lower-cased. Most
    customer text fields are compared upper-cased, so a case-only change by someone else goes unnoticed. On a
    mismatch, state returns to S but ACUP-OLD-* is NOT refreshed, so the screen shows the stale values
    fetched earlier. Every later F5 will hit the same mismatch until the user presses PF12 to re-read. 9700
    leaves by GO TO 9600-WRITE-PROCESSING-EXIT from inside a nested PERFORM (lines 4144, 4190).
  - >-
    READ UPDATE in CICS waits for a held lock rather than failing. The 'Could not lock' outcomes therefore come
    from NOTFND or other errors, which is how the cases below provoke them (record absent). Cases whose
    summary names an injected fault force that I/O error with given.file_conditions (see SCHEMA.md).
  - >-
    F5 does not re-run the edits (state N skips them, line 1464). It saves whatever the protected FSET fields
    send back. The cursor ends on ACCTSIDL in every state other than an edit error or 'no change'.
  - >-
    Dead or unreachable code. Line 2590 (S becomes N inside 2000) cannot be reached because 1205 always sets
    NO-CHANGES-DETECTED when it finds no change. 2625-2632 (state C in 2000) and the C check at 1465 cannot be
    reached because 0000-MAIN catches C at line 979 first. In 3009, the WHEN FOUND-ACCOUNT-DATA cursor rule
    never fires, because 3250 overwrites WS-INFO-MSG first. Unused 88s include WS-PROMPT-FOR-LASTNAME,
    WS-NAME-MUST-BE-ALPHA, CRED-LIMIT-IS-BLANK, THIS-MONTH-NOT-VALID and XREF-READ-ERROR. The 1230/1240
    alphanumeric edits are never called.
  - >-
    COMMAREA arrival quirks (lines 880-893). The menu test reads CARDDEMO-COMMAREA before it has been copied
    in, and WS-THIS-PROGCOMMAREA is copied from bytes beyond EIBCALEN when a caller passes only
    CARDDEMO-COMMAREA. A fresh arrival from COMEN01C still works because the second WHEN at line 966
    re-initializes the program area. An arrival from any other program with CDEMO-PGM-CONTEXT = 0 depends on
    whatever bytes follow its COMMAREA.
  - >-
    RESP rendering is inferred. ERROR-RESP and ERROR-RESP2 are X(10) receiving S9(9) COMP values, which gives
    9 digits plus a space. The not-found messages are longer than 75 bytes and lose the tail of RESP2.
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COACTUPC.yaml.
cases:
  # ---------------------------------------------------------------- entry and exit
  - id: COACTUPC-001
    summary: first-time entry (EIBCALEN = 0) shows a blank search screen prompting for the account id
    given:
      entry: first-time
      commarea: {}
    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      cursor: ACCTSIDL
      fields:
        ACCTSIDO: ""
        INFOMSGO: Enter or update id of account to update
        TRNNAMEO: CAUP
        PGMNAMEO: COACTUPC
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {CDEMO-PGM-CONTEXT: 1, ACUP-CHANGE-ACTION: ""}
      file_effects: []
    source:
      file: app/cbl/COACTUPC.cbl
      lines: [964, 973]

  - id: COACTUPC-002
    summary: arrival via XCTL from the main menu shows the blank search screen
    given:
      entry: xctl-from
      commarea: {CDEMO-FROM-PROGRAM: COMEN01C, CDEMO-FROM-TRANID: CM00, CDEMO-USER-TYPE: U, CDEMO-PGM-CONTEXT: 0}
    when:
      aid: ENTER
      fields: {}
    then:
      message: null
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "", INFOMSGO: Enter or update id of account to update}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {CDEMO-PGM-CONTEXT: 1, ACUP-CHANGE-ACTION: ""}
      file_effects: []
    source:
      file: app/cbl/COACTUPC.cbl
      lines: [964, 973]

  - id: COACTUPC-003
    summary: PF3 syncpoints and returns to the calling program, forcing user type U
    given:
      entry: reenter
      commarea: {CDEMO-FROM-PROGRAM: COMEN01C, CDEMO-FROM-TRANID: CM00, CDEMO-USER-TYPE: A, CDEMO-PGM-CONTEXT: 1, ACUP-CHANGE-ACTION: S}
    when:
      aid: PF3
      fields: {}
    then:
      message: null
      transfer: {via: XCTL, to: COMEN01C}
      commarea:
        CDEMO-TO-PROGRAM: COMEN01C
        CDEMO-TO-TRANID: CM00
        CDEMO-FROM-PROGRAM: COACTUPC
        CDEMO-FROM-TRANID: CAUP
        CDEMO-USER-TYPE: U
        CDEMO-PGM-CONTEXT: 0
        CDEMO-LAST-MAPSET: COACTUP
        CDEMO-LAST-MAP: CACTUPA
      file_effects: []
    source:
      file: app/cbl/COACTUPC.cbl
      lines: [927, 959]

  - id: COACTUPC-004
    summary: PF3 on first-time entry (no COMMAREA) goes to COMEN01C / CM00
    given:
      entry: first-time
      commarea: {}
    when:
      aid: PF3
      fields: {}
    then:
      message: null
      transfer: {via: XCTL, to: COMEN01C}
      commarea: {CDEMO-TO-PROGRAM: COMEN01C, CDEMO-TO-TRANID: CM00, CDEMO-FROM-PROGRAM: COACTUPC, CDEMO-FROM-TRANID: CAUP}
      file_effects: []
    source:
      file: app/cbl/COACTUPC.cbl
      lines: [930, 942]

  - id: COACTUPC-005
    summary: PF15 is folded onto PF3 and exits the same way
    given:
      entry: reenter
      commarea: {CDEMO-FROM-PROGRAM: COMEN01C, CDEMO-FROM-TRANID: CM00, CDEMO-PGM-CONTEXT: 1, ACUP-CHANGE-ACTION: ""}
    when:
      aid: PF15
      fields: {}
    then:
      message: null
      transfer: {via: XCTL, to: COMEN01C}
      file_effects: []
    source:
      file: app/cpy/CSSTRPFY.cpy
      lines: [58, 59]

  # ---------------------------------------------------------------- account search (state "")
  - id: COACTUPC-006
    summary: blank account id in search mode shows 'No input received' and marks the field with an asterisk
    given:
      entry: reenter
      commarea: &search {CDEMO-FROM-PROGRAM: COMEN01C, CDEMO-FROM-TRANID: CM00, CDEMO-USER-TYPE: U, CDEMO-PGM-CONTEXT: 1, ACUP-CHANGE-ACTION: ""}
    when:
      aid: ENTER
      fields: {ACCTSIDI: ""}
    then:
      message: No input received
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "*", INFOMSGO: Enter or update id of account to update}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: "", CDEMO-ACCT-ID: "00000000000"}
      file_effects: []
    source:
      file: app/cbl/COACTUPC.cbl
      lines: [1433, 1446]

  - id: COACTUPC-007
    summary: an asterisk typed as the account id is treated as blank
    given: {entry: reenter, commarea: *search}
    when: {aid: ENTER, fields: {ACCTSIDI: "*"}}
    then:
      message: No input received
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "*"}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [1051, 1058]}

  - id: COACTUPC-008
    summary: non-numeric account id is rejected
    given: {entry: reenter, commarea: *search}
    when: {aid: ENTER, fields: {ACCTSIDI: "ABCDEFGHIJK"}}
    then:
      message: "Account Number if supplied must be a 11 digit{} Non-Zero Number"
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "ABCDEFGHIJK", ERRMSGO: "Account Number if supplied must be a 11 digit Non-Zero Number"}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: "", CDEMO-ACCT-ID: "00000000000"}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [1801, 1813]}

  - id: COACTUPC-009
    summary: all-zero account id is rejected
    given: {entry: reenter, commarea: *search}
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000000"}}
    then:
      message: "Account Number if supplied must be a 11 digit{} Non-Zero Number"
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "00000000000", ERRMSGO: "Account Number if supplied must be a 11 digit Non-Zero Number"}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [1801, 1813]}

  - id: COACTUPC-010
    summary: short account id (space padded) fails the NUMERIC test
    given: {entry: reenter, commarea: *search}
    when: {aid: ENTER, fields: {ACCTSIDI: "12345"}}
    then:
      message: "Account Number if supplied must be a 11 digit{} Non-Zero Number"
      cursor: ACCTSIDL
      fields: {ERRMSGO: "Account Number if supplied must be a 11 digit Non-Zero Number"}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [1801, 1813]}

  - id: COACTUPC-011
    summary: account not in the card xref alternate index keeps search mode
    given:
      entry: reenter
      commarea: *search
      files: {CXACAIX: [], ACCTDAT: [], CUSTDAT: []}
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000099"}}
    then:
      message: "Account:{WS-CARD-RID-ACCT-ID-X} not found in{} Cross ref file.  Resp:{ERROR-RESP} Reas:{ERROR-RESP2}"
      cursor: ACCTSIDL
      fields: {ACCTSIDO: "00000000099", ACSTTUSO: "", INFOMSGO: Enter or update id of account to update}
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: ""}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [3668, 3685]}

  - id: COACTUPC-012
    summary: CXACAIX READ returns a RESP other than NORMAL/NOTFND (injected fault)
    given:
      entry: reenter
      commarea: *search
      file_conditions:
        - {file: CXACAIX, op: READ, resp: IOERR}
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000001"}}
    then:
      message: "File Error: {ERROR-OPNAME} on {ERROR-FILE} returned RESP {ERROR-RESP},RESP2 {ERROR-RESP2}"
      cursor: ACCTSIDL
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: ""}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [3686, 3693]}

  - id: COACTUPC-013
    summary: account missing from ACCTDAT but customer present moves to state S with the ACCTDAT error (latent bug)
    given:
      entry: reenter
      commarea: *search
      files:
        CXACAIX:
          - &xref {XREF-CARD-NUM: "0500024453765740", XREF-CUST-ID: "000000001", XREF-ACCT-ID: "00000000001"}
        ACCTDAT: []
        CUSTDAT:
          - &cust
            CUST-ID: "000000001"
            CUST-FIRST-NAME: Immanuel
            CUST-MIDDLE-NAME: Madeline
            CUST-LAST-NAME: Kessler
            CUST-ADDR-LINE-1: 618 Deshaun Route
            CUST-ADDR-LINE-2: Apt. 802
            CUST-ADDR-LINE-3: Altenwerthshire
            CUST-ADDR-STATE-CD: NY
            CUST-ADDR-COUNTRY-CD: USA
            CUST-ADDR-ZIP: "10001"
            CUST-PHONE-NUM-1: "(212)555-0100"
            CUST-PHONE-NUM-2: "(212)555-0101"
            CUST-SSN: "020973888"
            CUST-GOVT-ISSUED-ID: "00000000000049368437"
            CUST-DOB-YYYY-MM-DD: "1961-06-08"
            CUST-EFT-ACCOUNT-ID: "0053581756"
            CUST-PRI-CARD-HOLDER-IND: Y
            CUST-FICO-CREDIT-SCORE: "750"
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000001"}}
    then:
      message: "Account:{WS-CARD-RID-ACCT-ID-X} not found in{} Acct Master file.Resp:{ERROR-RESP} Reas:{ERROR-RESP2}"
      cursor: ACCTSIDL
      fields:
        ACCTSIDO: "00000000001"
        ACSTNUMO: "000000001"
        ACSFNAMO: Immanuel
        ACSLNAMO: Kessler
        INFOMSGO: Update account details presented above.
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: S, CDEMO-CUST-ID: "000000001", ACUP-OLD-CUST-ID: "000000001"}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [3620, 3643]}

  - id: COACTUPC-014
    summary: ACCTDAT READ returns a RESP other than NORMAL/NOTFND (injected fault); customer still read, state S
    given:
      entry: reenter
      commarea: *search
      files: {CXACAIX: [*xref], CUSTDAT: [*cust]}
      file_conditions:
        - {file: ACCTDAT, op: READ, resp: IOERR}
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000001"}}
    then:
      message: "File Error: {ERROR-OPNAME} on {ERROR-FILE} returned RESP {ERROR-RESP},RESP2 {ERROR-RESP2}"
      cursor: ACCTSIDL
      transfer: {via: RETURN-TRANSID, to: CAUP}
      commarea: {ACUP-CHANGE-ACTION: S}
      file_effects: []
    source: {file: app/cbl/COACTUPC.cbl, lines: [3736, 3743]}

  - id: COACTUPC-015
    summary: customer missing from CUSTDAT keeps search mode with blank detail fields
    given:
      entry: reenter
      commarea: *search
      files:
        CXACAIX: [*xref]
        ACCTDAT:
          - &acct
            ACCT-ID: "00000000001"
            ACCT-ACTIVE-STATUS: Y
            ACCT-CURR-BAL: "1940.00"
            ACCT-CREDIT-LIMIT: "2020.00"
            ACCT-CASH-CREDIT-LIMIT: "1020.00"
            ACCT-OPEN-DATE: "2014-11-20"
            ACCT-EXPIRAION-DATE: "2025-05-20"
            ACCT-REISSUE-DATE: "2025-05-20"
            ACCT-CURR-CYC-CREDIT: "0.00"
            ACCT-CURR-CYC-DEBIT: "0.00"
            ACCT-ADDR-ZIP: "10001"
            ACCT-GROUP-ID: A000000000
        CUSTDAT: []
    when: {aid: ENTER, fields: {ACCTSIDI: "00000000001"}}
    then:
