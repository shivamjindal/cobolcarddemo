program: COUSR02C
transaction: CU02
screen:
  mapset: COUSR02
  map: COUSR2A
evidence: derived
sources:
  - app/cbl/COUSR02C.cbl
  - app/cpy/CSUSR01Y.cpy
  - app/cpy/COCOM01Y.cpy
  - app/cpy/CSMSG01Y.cpy
  - app/bms/COUSR02.bms
files:
  - name: USRSEC
    ops: [READ-UPDATE, REWRITE]
    key: SEC-USR-ID
navigation:
  - to: COSGN00C
    via: XCTL
    when: EIBCALEN = 0 (lines 90-92), COMMAREA passed (lines 250-261)
  - to: COUSR00C
    via: XCTL
    when: PF3 when CDEMO-FROM-PROGRAM is COUSR00C, i.e. arrived from the user list (lines 111-119). PF3 runs UPDATE-USER-INFO first.
  - to: COADM01C
    via: XCTL
    when: PF3 when CDEMO-FROM-PROGRAM is COADM01C or blank (lines 113-114), or PF12 (lines 124-126)
  - to: CU02
    via: RETURN-TRANSID
    when: every path that displays the update screen (lines 135-138)
notes:
  - Field and record values are right-trimmed.
  - "CDEMO-CU02-INFO (lines 50-58) has the same layout as COUSR00C's CDEMO-CU00-INFO. CDEMO-CU02-USR-SELECTED is the ID chosen on the list. Arriving from COADM01C, the shorter COMMAREA is moved into the longer group (line 94), so the CU02 fields are padded with spaces and nothing is pre-selected."
  - "PF3 is save-and-exit. It PERFORMs UPDATE-USER-INFO (line 112) and then XCTLs unconditionally (line 119). Validation errors, 'Please modify to update ...', or a failed REWRITE are sent to the terminal and immediately replaced by the target program's screen. The REWRITE still happens when fields changed. PF12 exits without saving."
  - "Multiple SENDs per task. READ-USER-SEC-FILE sends the screen on NORMAL with 'Press PF5 key to save your updates ...' before the record fields are moved to the map (lines 334-339). PROCESS-ENTER-KEY then sends again with the fields (lines 165-171), and the first-entry path sends a third time (line 105). The final screen has the fields and the PF5 prompt. On PF5 the READ's prompt screen is followed by the update result screen."
  - "Latent bug. In UPDATE-USER-INFO the field comparison and REWRITE (lines 219-243) run even when the READ just failed, because ERR-FLG is tested only once before the READ (line 215). For a user ID not on file, READ NOTFND sends 'User ID NOT found...'. The comparisons then find the typed values differ from the stale SEC-USER-DATA, and REWRITE runs without a prior READ UPDATE. CICS returns INVREQ, and the final message is 'Unable to Update User...' (case COUSR02C-016). The REWRITE NOTFND branch (lines 377-382) is effectively unreachable."
  - "Cursor in COUSR02C-016. USRIDINL is set to -1 by the NOTFND branch (line 344), and FNAMEL by lines 211 and 387. USRIDIN precedes FNAME in app/bms/COUSR02.bms (lines 85, 103), so symbolic cursor positioning puts the cursor on User ID."
  - "PF5 updates whatever user ID is in USRIDIN at the time, using the screen's name, password and type. If the operator loads user A with ENTER, overtypes the ID with B and presses PF5, B's record is overwritten with A's displayed fields. The ID field is unprotected (FSET,UNPROT)."
  - Change detection is an exact, case-sensitive compare of each X field (lines 219-234). No upper-casing is applied to any field, and user type accepts any non-blank character. A changed password is stored verbatim, so a lower-case password locks the user out of COSGN00C, which upper-cases typed passwords.
  - "The current password is loaded into PASSWDI and sent to the terminal (line 169). The field is DRK (non-display) in app/bms/COUSR02.bms line 130, but the cleartext value is in the 3270 data stream."
  - Lookup by user ID is case-sensitive with no upper-casing (lines 162, 216). 'admin001' does not find ADMIN001.
  - READ ... UPDATE (lines 322-331) takes a record lock that is released when the task ends at RETURN. There is no lock or version check between the ENTER that displays the record and the PF5 that rewrites it.
  - "'Unable to lookup User...' (lines 346-352) appears for other READ errors. On PF5 it falls through to the same REWRITE INVREQ path, so the final message would be 'Unable to Update User...'. No case asserts it because the schema cannot inject a file error."
  - Message colours (DFHNEUTR prompt, DFHRED for no-change, DFHGREEN for success) are not asserted because the schema has no attribute field.
  - The invalid-key path (lines 127-130) sets no length to -1. The cursor falls back to the IC field USRIDIN, so no cursor is asserted.
  - There is no user-type check. Any caller with a COMMAREA can update users, including changing a type to 'A'.
  - The Java slice replays this spec with deliberate differences listed, each with its reason, in carddemo-java/src/test/resources/spec-overrides/COUSR02C.yaml.
