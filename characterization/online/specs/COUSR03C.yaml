    when:
      aid: ENTER
      fields: {USRIDINI: NOBODY99}
    then:
      message: "User ID NOT found..."
      cursor: USRIDINL
      fields:
        FNAMEO: ""
        LNAMEO: ""
        USRTYPEO: ""
      transfer: {via: RETURN-TRANSID, to: CU03}
      file_effects: []
    source:
      file: app/cbl/COUSR03C.cbl
      lines: [286, 292]

  - id: COUSR03C-007
    summary: PF5 with a blank user ID is rejected and nothing is deleted
    given:
      entry: reenter
      commarea: {CDEMO-PGM-CONTEXT: 1}
    when:
      aid: PF5
      fields: {USRIDINI: ""}
    then:
      message: "User ID can NOT be empty..."
      cursor: USRIDINL
      transfer: {via: RETURN-TRANSID, to: CU03}
      file_effects: []
    source:
