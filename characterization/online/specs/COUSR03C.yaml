      lines: [176, 182]

  - id: COUSR03C-008
    summary: PF5 on an existing ID deletes the record, clears the screen and confirms in green
    given:
      entry: reenter
      commarea: {CDEMO-PGM-CONTEXT: 1}
      files:
        USRSEC:
          - {SEC-USR-ID: USER0004, SEC-USR-FNAME: AVERARDO, SEC-USR-LNAME: MAZZI, SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U}
    when:
      aid: PF5
      fields: {USRIDINI: USER0004}
    then:
      message: "User {SEC-USR-ID} has been deleted ..."
      cursor: USRIDINL
      fields:
        USRIDINO: ""
        FNAMEO: ""
        LNAMEO: ""
        USRTYPEO: ""
      transfer: {via: RETURN-TRANSID, to: CU03}
      file_effects:
        - file: USRSEC
          op: DELETE
          record: {SEC-USR-ID: USER0004}
    source:
      file: app/cbl/COUSR03C.cbl
      lines: [313, 322]

  - id: COUSR03C-009
    summary: PF5 on an ID not on file ends with 'Unable to Update User...' because DELETE runs after the failed READ (see notes)
